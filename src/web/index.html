<!DOCTYPE html>
<html>
<head>
<title>PM — Research Project Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0d1117; color: #c9d1d9; }
#header { background: #161b22; padding: 12px 24px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
#header h1 { font-size: 16px; color: #58a6ff; }
#controls { display: flex; gap: 8px; }
button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; }
button:hover { background: #30363d; }
button.active { background: #1f6feb; border-color: #1f6feb; }
#main { display: flex; height: calc(100vh - 49px); }
#sidebar { width: 300px; min-width: 300px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; padding: 16px; position: relative; z-index: 5; }
#sidebar h2 { font-size: 13px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

/* Tree node styles */
.tree-node { display: flex; align-items: center; padding: 4px 8px; margin-bottom: 2px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; user-select: none; min-width: 0; }
.tree-node:hover { border-color: #58a6ff; background: #0d1117; }
.tree-node.selected { border-color: #1f6feb; background: #161b22; }
.tree-node.paused { opacity: 0.7; }
.tree-node.archived-item { opacity: 0.5; }
.tree-node.archived-item .tree-project-name { text-decoration: line-through; }
.tree-toggle { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; font-size: 8px; color: #8b949e; flex-shrink: 0; margin-right: 2px; transition: transform 0.15s ease; }
.tree-toggle.collapsed { transform: rotate(-90deg); }
.tree-toggle.leaf { visibility: hidden; }
.tree-project-name { color: #f0f6fc; font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 60px; }
.tree-node.depth-1 .tree-project-name { font-weight: normal; color: #c9d1d9; font-size: 11px; }
.tree-node.depth-2 .tree-project-name { font-weight: normal; color: #8b949e; font-size: 11px; }
.tree-node-count { font-size: 9px; color: #6e7681; margin-left: auto; flex-shrink: 0; padding-left: 4px; }
.tree-children { overflow: hidden; transition: max-height 0.2s ease; }
.tree-children.collapsed { max-height: 0 !important; overflow: hidden; }
.tree-alias { font-size: 9px; color: #6e7681; margin-left: 4px; }
.tree-status-badge { font-size: 8px; padding: 0 3px; border-radius: 2px; margin-left: 3px; }
.tree-status-badge.paused { background: #d29922; color: #0d1117; }
.tree-status-badge.archived { background: #484f58; color: #c9d1d9; }

.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; cursor: pointer; vertical-align: middle; border: 1px solid transparent; flex-shrink: 0; }
.status-dot:hover { border-color: #fff; transform: scale(1.3); }
.status-dot.active { background: #3fb950; }
.status-dot.paused { background: #d29922; }
.status-dot.archived { background: #484f58; }

.archived-section { margin-top: 10px; border-top: 1px solid #30363d; padding-top: 6px; }
.archived-toggle { cursor: pointer; padding: 4px 0; color: #6e7681; font-size: 10px; user-select: none; }
.archived-toggle:hover { color: #c9d1d9; }
.archived-list { display: none; }

.subproject-hull { pointer-events: all; cursor: pointer; }
.subproject-hull:hover { fill-opacity: 0.12 !important; }
.subproject-label { font-size: 10px; fill: #8b949e; font-weight: bold; pointer-events: none; }
#graph-container { flex: 1; position: relative; overflow: hidden; }
#graph-container svg { width: 100%; height: 100%; display: block; }
#tooltip {
  position: fixed; background: #1c2128; border: 1px solid #30363d; border-radius: 8px;
  padding: 12px; max-width: 480px; max-height: 400px; overflow-y: auto;
  font-size: 11px; display: none; z-index: 100; pointer-events: none;
}
#tooltip .tt-type { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
#tooltip .tt-title { color: #f0f6fc; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
#tooltip .tt-body { color: #8b949e; line-height: 1.4; }
#tooltip .tt-body strong { color: #c9d1d9; }
#tooltip .tt-body em { color: #b0b8c0; font-style: italic; }
#tooltip .tt-body code { background: #0d1117; padding: 1px 4px; border-radius: 3px; font-size: 10px; color: #79c0ff; }
#tooltip .tt-body ul { margin: 4px 0 4px 16px; }
#tooltip .tt-body li { margin: 2px 0; }
#tooltip .tt-field { margin: 3px 0; }
#tooltip .tt-field-label { color: #58a6ff; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
#tooltip .tt-field-value { color: #c9d1d9; margin-left: 4px; }
.legend { position: absolute; bottom: 16px; right: 16px; background: #161b22ee; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 10px; z-index: 5; }
.legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-line { height: 2px; border-radius: 1px; }

/* Search styles */
#kg-search-box { width: 100%; padding: 6px 8px; margin-bottom: 6px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; font-family: inherit; font-size: 11px; outline: none; }
#kg-search-box:focus { border-color: #58a6ff; }
#kg-search-box::placeholder { color: #484f58; }
#clear-search-btn { display: none; width: 100%; padding: 4px 8px; margin-bottom: 8px; font-size: 10px; background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 4px; cursor: pointer; }
#clear-search-btn:hover { background: #30363d; color: #c9d1d9; }
#search-results { display: none; max-height: 300px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #30363d; border-radius: 4px; }
.search-result-item { display: flex; align-items: flex-start; gap: 6px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid #21262d; font-size: 11px; transition: background 0.1s; }
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: #0d1117; }
.search-result-item.top-result { border-left: 2px solid #58a6ff; }
.sr-icon { flex-shrink: 0; width: 16px; height: 16px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; color: #0d1117; }
.sr-body { flex: 1; min-width: 0; }
.sr-type { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #6e7681; }
.sr-text { color: #c9d1d9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-score { flex-shrink: 0; font-size: 9px; color: #484f58; padding-top: 2px; }
#search-count { font-size: 9px; color: #6e7681; padding: 4px 8px; border-bottom: 1px solid #21262d; }
</style>
</head>
<body>
<div id="header">
  <h1>PM — Research Dashboard</h1>
  <div id="controls">
    <button id="btn-kg" class="active" onclick="setView('kg')">Knowledge Graph</button>
    <button id="btn-dag" onclick="setView('dag')">Phase DAG</button>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <h2>Projects</h2>
    <input type="text" id="kg-search-box" placeholder="Search KG..." onkeyup="if(event.key==='Enter') performSearch(this.value)">
    <button id="clear-search-btn" onclick="clearSearch()">Clear Search</button>
    <div id="search-results">
      <div id="search-count"></div>
      <div id="search-result-list"></div>
    </div>
    <div id="project-tree"></div>
    <h2 style="margin-top:16px">Dashboard</h2>
    <div id="dashboard-text" style="font-size:11px;color:#8b949e;white-space:pre-wrap"></div>
  </div>
  <div id="graph-container"></div>
</div>
<div id="tooltip"><div class="tt-type"></div><div class="tt-title"></div><div class="tt-body"></div></div>
<div class="legend" id="legend-kg">
  <div style="font-weight:bold;margin-bottom:4px;color:#8b949e">NODE TYPES</div>
  <div class="legend-item"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#3fb950"/></svg>Experiment</div>
  <div class="legend-item"><svg width="12" height="12"><polygon points="6,1 11,6 6,11 1,6" fill="#e8883a"/></svg>Decision</div>
  <div class="legend-item"><svg width="12" height="12"><polygon points="6,1 11,4 11,9 6,12 1,9 1,4" fill="#2dd4bf"/></svg>Research</div>
  <div class="legend-item"><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="#58a6ff"/></svg>Finding</div>
  <div class="legend-item"><svg width="12" height="12"><polygon points="6,0 7.8,4.1 12,4.6 8.9,7.4 9.7,11.5 6,9.5 2.3,11.5 3.1,7.4 0,4.6 4.2,4.1" fill="#fbbf24"/></svg>Principle</div>
  <div class="legend-item"><svg width="12" height="12"><polygon points="6,1 11,10 1,10" fill="#c084fc"/></svg>Hypothesis</div>
  <div class="legend-item"><svg width="12" height="12"><polygon points="3,0 9,0 12,3 12,9 9,12 3,12 0,9 0,3" fill="#93c5fd"/></svg>Literature</div>
  <div class="legend-item"><svg width="12" height="12"><polygon points="6,1 10,4 10,8 6,11 2,8 2,4" fill="#f87171"/></svg>Constraint</div>
  <div class="legend-item"><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" rx="2" fill="#8b949e"/></svg>Phase</div>
  <div style="font-weight:bold;margin:6px 0 4px;color:#8b949e">EDGES</div>
  <div class="legend-item"><div class="legend-line" style="background:#f85149;width:20px"></div>Contradicts</div>
  <div class="legend-item"><div class="legend-line" style="background:#3fb950;width:20px"></div>Supports</div>
  <div class="legend-item"><div class="legend-line" style="background:#79c0ff;width:20px"></div>DependsOn</div>
  <div class="legend-item"><div class="legend-line" style="background:#e8883a;width:20px"></div>Informed</div>
  <div class="legend-item"><div class="legend-line" style="background:#a371f7;width:20px"></div>Supersedes</div>
  <div class="legend-item"><div class="legend-line" style="background:#30363d;width:20px;opacity:0.3"></div>Structural</div>
</div>
<div class="legend" id="legend-dag" style="display:none">
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Complete</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>In Progress</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b949e"></div>Pending</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f85149"></div>Paused</div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
let currentProject = null;
let currentView = 'kg';
let pinnedNode = null;
let pinnedNodeEl = null;
let allProjectsData = [];
let activeSubprojectFilter = null;

const tooltip = document.getElementById('tooltip');

function miniMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n/g, '<br>');
}

const TYPE_COLORS = {
  experiment: '#3fb950', decision: '#e8883a', research: '#2dd4bf',
  finding: '#58a6ff', principle: '#fbbf24', hypothesis: '#c084fc',
  literature: '#93c5fd', constraint: '#f87171', phase: '#8b949e',
  feedback: '#a5b4fc',
};

const SUBPROJECT_COLORS = [
  '#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51',
  '#606c38', '#283618', '#dda15e', '#bc6c25', '#457b9d',
  '#6d6875', '#b5838d', '#ffb4a2', '#e5989b', '#6b705c',
];

function formatNodeCounts(nc) {
  const parts = [];
  if (nc.phases) parts.push(nc.phases + ' ph');
  if (nc.experiments) parts.push(nc.experiments + ' exp');
  if (nc.findings) parts.push(nc.findings + ' find');
  if (nc.literature) parts.push(nc.literature + ' lit');
  if (nc.decisions) parts.push(nc.decisions + ' dec');
  return parts.join(', ') || 'empty';
}

function statusDotClass(status) {
  if (status === 'Paused') return 'paused';
  if (status === 'Archived') return 'archived';
  return 'active';
}

// --- Collapse state persistence ---
function getCollapseState() {
  try {
    const raw = sessionStorage.getItem('pm-tree-collapse');
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function setCollapseState(state) {
  try { sessionStorage.setItem('pm-tree-collapse', JSON.stringify(state)); } catch {}
}

function isCollapsed(projectId, depth) {
  const state = getCollapseState();
  if (state.hasOwnProperty(projectId)) return state[projectId];
  // Default: depth 0 expanded, depth 1+ collapsed
  return depth >= 1;
}

function toggleCollapse(projectId, depth) {
  const state = getCollapseState();
  const current = state.hasOwnProperty(projectId) ? state[projectId] : (depth >= 1);
  state[projectId] = !current;
  setCollapseState(state);
  updateCollapseVisuals();
}

function updateCollapseVisuals() {
  document.querySelectorAll('.tree-children').forEach(el => {
    const pid = el.dataset.parentId;
    const depth = parseInt(el.dataset.depth || '0');
    const collapsed = isCollapsed(parseInt(pid), depth);
    el.classList.toggle('collapsed', collapsed);
    // Update arrow
    const toggle = document.querySelector(`.tree-toggle[data-id="${pid}"]`);
    if (toggle && !toggle.classList.contains('leaf')) {
      toggle.classList.toggle('collapsed', collapsed);
    }
  });
}

// --- Project tree building ---
function buildProjectTree(projects, parentId, depth) {
  if (parentId === undefined) parentId = null;
  if (depth === undefined) depth = 0;
  return projects
    .filter(function(p) { return p.parent_id === parentId; })
    .map(function(p) {
      var children = buildProjectTree(projects, p.id, depth + 1);
      return Object.assign({}, p, { children: children, depth: depth });
    });
}

function getAllDescendantIds(parentId) {
  var children = allProjectsData.filter(function(p) { return p.parent_id === parentId; });
  var ids = children.map(function(c) { return c.id; });
  for (var i = 0; i < children.length; i++) {
    ids = ids.concat(getAllDescendantIds(children[i].id));
  }
  return ids;
}

async function toggleProjectStatus(projectId, projectName, currentStatus) {
  var newStatus, statusLabel;
  if (currentStatus === 'Active') {
    var choice = prompt('Change status for "' + projectName + '":\n1) Archive (hide from default view)\n2) Pause (dim in dashboard)\n\nEnter 1 or 2 (or cancel):');
    if (!choice) return;
    if (choice.trim() === '2') {
      newStatus = 'paused'; statusLabel = 'Pause';
    } else {
      newStatus = 'archived'; statusLabel = 'Archive';
    }
  } else if (currentStatus === 'Paused') {
    var choice = prompt('Change status for "' + projectName + '" (currently Paused):\n1) Reactivate\n2) Archive\n\nEnter 1 or 2 (or cancel):');
    if (!choice) return;
    if (choice.trim() === '2') {
      newStatus = 'archived'; statusLabel = 'Archive';
    } else {
      newStatus = 'active'; statusLabel = 'Reactivate';
    }
  } else {
    newStatus = 'active'; statusLabel = 'Reactivate';
  }

  // Check for children and offer cascade
  var descendantIds = getAllDescendantIds(projectId);
  var doCascade = false;

  if (descendantIds.length > 0) {
    doCascade = confirm(
      statusLabel + ' "' + projectName + '" and its ' + descendantIds.length + ' subproject(s)?\n\n' +
      'OK = apply to all subprojects\nCancel = apply to "' + projectName + '" only'
    );
    // If user cancels cascade, still confirm the single-project change
    if (!doCascade) {
      if (!confirm(statusLabel + ' "' + projectName + '" only (no subprojects)?')) return;
    }
  } else {
    if (!confirm(statusLabel + ' "' + projectName + '"?')) return;
  }

  // Update the clicked project
  var resp = await fetch('/api/projects/' + projectId + '/status', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: newStatus})
  });
  if (!resp.ok) {
    alert('Failed to update project status');
    return;
  }

  // Cascade to descendants if requested
  if (doCascade) {
    for (var i = 0; i < descendantIds.length; i++) {
      await fetch('/api/projects/' + descendantIds[i] + '/status', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({status: newStatus})
      });
    }
  }

  loadProjects();
}

function renderTreeNode(proj, container) {
  const hasChildren = proj.children && proj.children.length > 0;
  const collapsed = isCollapsed(proj.id, proj.depth);

  // Node row
  const node = document.createElement('div');
  node.className = 'tree-node depth-' + proj.depth;
  if (proj.status === 'Paused') node.className += ' paused';
  if (proj.status === 'Archived') node.className += ' archived-item';
  node.dataset.id = proj.id;
  node.style.paddingLeft = (8 + proj.depth * 16) + 'px';

  // Toggle arrow
  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle' + (hasChildren ? (collapsed ? ' collapsed' : '') : ' leaf');
  toggle.dataset.id = proj.id;
  toggle.textContent = '\u25BC';
  if (hasChildren) {
    toggle.onclick = function(ev) {
      ev.stopPropagation();
      toggleCollapse(proj.id, proj.depth);
    };
  }
  node.appendChild(toggle);

  // Status dot
  const dot = document.createElement('span');
  dot.className = 'status-dot ' + statusDotClass(proj.status);
  dot.title = proj.status + ' -- click to change';
  dot.onclick = function(ev) {
    ev.stopPropagation();
    toggleProjectStatus(proj.id, proj.name, proj.status);
  };
  node.appendChild(dot);

  // Project name
  const nameSpan = document.createElement('span');
  nameSpan.className = 'tree-project-name';
  nameSpan.textContent = proj.name;
  nameSpan.setAttribute('title', proj.name + (proj.alias ? ' [' + proj.alias + ']' : '') + ' (' + proj.status + ')');
  node.appendChild(nameSpan);

  // Alias badge
  if (proj.alias) {
    const alias = document.createElement('span');
    alias.className = 'tree-alias';
    alias.textContent = proj.alias;
    node.appendChild(alias);
  }

  // Status badge (for non-active)
  if (proj.status !== 'Active') {
    const badge = document.createElement('span');
    badge.className = 'tree-status-badge ' + proj.status.toLowerCase();
    badge.textContent = proj.status.toLowerCase();
    node.appendChild(badge);
  }

  // Node counts
  const projData = allProjectsData.find(function(p) { return p.id === proj.id; });
  if (projData && projData.node_counts) {
    const countStr = formatNodeCounts(projData.node_counts);
    if (countStr !== 'empty') {
      const countSpan = document.createElement('span');
      countSpan.className = 'tree-node-count';
      countSpan.textContent = countStr;
      node.appendChild(countSpan);
    }
  }

  // Click handler to select project
  node.onclick = function(ev) {
    ev.stopPropagation();
    selectProject(proj.id, node, hasChildren);
  };

  container.appendChild(node);

  // Children container
  if (hasChildren) {
    const childContainer = document.createElement('div');
    childContainer.className = 'tree-children' + (collapsed ? ' collapsed' : '');
    childContainer.dataset.parentId = proj.id;
    childContainer.dataset.depth = proj.depth;
    for (const child of proj.children) {
      renderTreeNode(child, childContainer);
    }
    container.appendChild(childContainer);
  }
}

async function loadProjects() {
  const res = await fetch('/api/projects');
  allProjectsData = await res.json();
  const tree = document.getElementById('project-tree');
  tree.innerHTML = '';

  // Build recursive tree from flat list
  const flatProjects = allProjectsData.map(function(p) {
    return { id: p.id, name: p.name, alias: p.alias, status: p.status, parent_id: p.parent_id, node_counts: p.node_counts };
  });
  const projectTree = buildProjectTree(flatProjects, null, 0);

  // Split into active/paused and archived at top level
  const activeTree = projectTree.filter(function(p) { return p.status !== 'Archived'; });
  const archivedTree = projectTree.filter(function(p) { return p.status === 'Archived'; });

  for (const proj of activeTree) {
    renderTreeNode(proj, tree);
  }

  // Archived section
  if (archivedTree.length > 0) {
    const section = document.createElement('div');
    section.className = 'archived-section';

    const toggle = document.createElement('div');
    toggle.className = 'archived-toggle';
    toggle.id = 'archived-toggle-text';
    toggle.textContent = '\u25B6 Archived (' + archivedTree.length + ')';
    toggle.onclick = function() {
      const list = document.getElementById('archived-project-list');
      if (list.style.display === 'none') {
        list.style.display = 'block';
        toggle.textContent = toggle.textContent.replace(/^[^ ]/, '\u25BC');
      } else {
        list.style.display = 'none';
        toggle.textContent = toggle.textContent.replace(/^[^ ]/, '\u25B6');
      }
    };
    section.appendChild(toggle);

    const list = document.createElement('div');
    list.id = 'archived-project-list';
    list.className = 'archived-list';
    list.style.display = 'none';
    for (const proj of archivedTree) {
      renderTreeNode(proj, list);
    }
    section.appendChild(list);
    tree.appendChild(section);
  }

  const dash = await fetch("/api/dashboard").then(r => r.json());
  const dashEl = document.getElementById('dashboard-text');
  dashEl.innerHTML = '';
  if (dash.items && dash.items.length > 0) {
    dash.items.forEach(function(item) {
      const card = document.createElement('div');
      card.style.cssText = 'background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:6px 8px;margin-bottom:4px;font-size:11px;cursor:pointer;';
      card.onmouseenter = function() { card.style.borderColor = '#58a6ff'; };
      card.onmouseleave = function() { card.style.borderColor = '#30363d'; };
      const proj = document.createElement('div');
      proj.style.cssText = 'color:#58a6ff;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;';
      proj.textContent = item.project;
      const phase = document.createElement('div');
      phase.style.cssText = 'color:#c9d1d9;';
      phase.textContent = item.phase_name;
      const impact = document.createElement('div');
      impact.style.cssText = 'color:#6e7681;font-size:9px;margin-top:2px;';
      impact.textContent = 'Phase #' + item.phase_id + ' · impact ' + item.impact;
      card.appendChild(proj);
      card.appendChild(phase);
      card.appendChild(impact);
      dashEl.appendChild(card);
    });
  } else {
    dashEl.textContent = 'No active phases';
  }

  // Select first active project
  if (activeTree.length > 0) {
    const first = activeTree[0];
    const firstItem = tree.querySelector('.tree-node');
    const hasSubs = first.children && first.children.length > 0;
    selectProject(first.id, firstItem, hasSubs);
  }
}

async function selectProject(id, item, includeSubprojects) {
  currentProject = id;
  pinnedNode = null;
  pinnedNodeEl = null;
  activeSubprojectFilter = null;
  tooltip.style.display = 'none';
  document.querySelectorAll('.tree-node').forEach(function(c) { c.classList.remove('selected'); });
  if (item) item.classList.add('selected');
  const container = document.getElementById('graph-container');
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b949e;font-size:14px">Loading graph...</div>';
  if (currentView === 'kg') await loadKG(id, includeSubprojects);
  else await loadDAG(id);
}

function setView(view) {
  currentView = view;
  document.getElementById('btn-kg').classList.toggle('active', view === 'kg');
  document.getElementById('btn-dag').classList.toggle('active', view === 'dag');
  document.getElementById('legend-kg').style.display = view === 'kg' ? '' : 'none';
  document.getElementById('legend-dag').style.display = view === 'dag' ? '' : 'none';
  if (currentProject) {
    const item = document.querySelector('.tree-node.selected');
    const projData = allProjectsData.find(function(p) { return p.id === currentProject; });
    const hasSubs = projData && projData.children && projData.children.length > 0;
    selectProject(currentProject, item, hasSubs);
  }
}

function drawNodeShape(ng, type, color, size) {
  const s = size || 8;
  switch (type) {
    case 'finding':
      return ng.append('circle').attr('class', 'node-shape').attr('r', s * 0.5).attr('fill', color).attr('fill-opacity', 0.7);
    case 'experiment':
      return ng.append('circle').attr('class', 'node-shape').attr('r', s).attr('fill', color).attr('fill-opacity', 0.85);
    case 'decision': {
      const d = s;
      return ng.append('polygon').attr('class', 'node-shape')
        .attr('points', `0,${-d} ${d},0 0,${d} ${-d},0`)
        .attr('fill', color).attr('fill-opacity', 0.9);
    }
    case 'phase':
      return ng.append('rect').attr('class', 'node-shape')
        .attr('x', -s*2.5).attr('y', -s).attr('width', s*5).attr('height', s*2)
        .attr('rx', 4).attr('fill', color).attr('fill-opacity', 0.7);
    case 'hypothesis':
      return ng.append('polygon').attr('class', 'node-shape')
        .attr('points', `0,${-s} ${s},${s*0.8} ${-s},${s*0.8}`)
        .attr('fill', color).attr('fill-opacity', 0.8);
    case 'literature': {
      const r = s * 0.9;
      const pts = [0,1,2,3,4,5].map(function(i) {
        const a = Math.PI/6 + i * Math.PI/3;
        return `${r*Math.cos(a)},${r*Math.sin(a)}`;
      }).join(' ');
      return ng.append('polygon').attr('class', 'node-shape')
        .attr('points', pts).attr('fill', color).attr('fill-opacity', 0.7);
    }
    case 'principle': {
      const outer = s, inner = s * 0.4;
      const pts = [];
      for (let i = 0; i < 5; i++) {
        const ao = -Math.PI/2 + i * 2*Math.PI/5;
        const ai = -Math.PI/2 + (i+0.5) * 2*Math.PI/5;
        pts.push(`${outer*Math.cos(ao)},${outer*Math.sin(ao)}`);
        pts.push(`${inner*Math.cos(ai)},${inner*Math.sin(ai)}`);
      }
      return ng.append('polygon').attr('class', 'node-shape')
        .attr('points', pts.join(' ')).attr('fill', color).attr('fill-opacity', 0.85);
    }
    case 'constraint': {
      const w = s * 0.35, h = s;
      return ng.append('polygon').attr('class', 'node-shape')
        .attr('points', `${-w},${-h} ${w},${-h} ${w},${-w} ${h},${-w} ${h},${w} ${w},${w} ${w},${h} ${-w},${h} ${-w},${w} ${-h},${w} ${-h},${-w} ${-w},${-w}`)
        .attr('fill', color).attr('fill-opacity', 0.8);
    }
    case 'research': {
      const r = s * 0.9;
      const pts = [0,1,2,3,4,5].map(function(i) {
        const a = i * Math.PI/3;
        return `${r*Math.cos(a)},${r*Math.sin(a)}`;
      }).join(' ');
      return ng.append('polygon').attr('class', 'node-shape')
        .attr('points', pts).attr('fill', color).attr('fill-opacity', 0.85);
    }
    default:
      return ng.append('circle').attr('class', 'node-shape').attr('r', s * 0.5).attr('fill', color).attr('fill-opacity', 0.6);
  }
}

function buildTooltipHtml(d) {
  let html = '';
  const extra = d.extra || {};

  function field(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return '<div class="tt-field"><span class="tt-field-label">' + label + ':</span> <span class="tt-field-value">' + miniMarkdown(String(value)) + '</span></div>';
  }

  if (d.text) html += '<div style="margin-bottom:6px">' + miniMarkdown(d.text.substring(0, 500)) + '</div>';

  switch (d.type) {
    case 'phase':
      html += field('Status', d.status);
      html += field('Impact', extra.impact);
      html += field('Description', extra.description);
      html += field('Goals', extra.goals);
      html += field('Success Criteria', extra.success_criteria);
      if (extra.depends_on && extra.depends_on.length) html += field('Depends On', extra.depends_on.map(function(id) { return '#' + id; }).join(', '));
      html += field('Started', extra.started_at);
      html += field('Completed', extra.completed_at);
      break;
    case 'experiment':
      html += field('Status', d.status);
      html += field('Hypothesis', extra.hypothesis);
      html += field('Result', extra.result);
      html += field('Notes', extra.notes);
      break;
    case 'hypothesis':
      html += field('Status', d.status);
      html += field('Prediction', extra.prediction);
      html += field('Criteria', extra.criteria);
      html += field('Confidence', extra.confidence != null ? (extra.confidence * 100).toFixed(0) + '%' : null);
      break;
    case 'literature':
      html += field('Authors', extra.authors);
      html += field('Venue', extra.venue);
      html += field('Year', extra.year);
      html += field('ArXiv', extra.arxiv_id);
      html += field('Status', d.status);
      html += field('Summary', extra.summary);
      html += field('Relevance', extra.relevance);
      html += field('Key Findings', extra.key_findings);
      if (extra.url) html += field('URL', extra.url);
      if (extra.code_url) html += field('Code', extra.code_url);
      break;
    case 'principle':
      html += field('Scope', extra.scope);
      html += field('Status', d.status);
      html += field('Rationale', extra.rationale);
      html += field('Enforcement', extra.enforcement_level);
      break;
    case 'constraint':
      html += field('Scope', extra.scope);
      html += field('Severity', extra.severity);
      html += field('Resource', extra.resource);
      html += field('Measured Value', extra.measured_value);
      html += field('Source', extra.source);
      html += field('Expires', extra.expires_at);
      break;
    case 'decision':
      html += field('Why', extra.why);
      break;
    case 'research':
      html += field('Status', d.status);
      html += field('Report', extra.report);
      break;
    case 'finding':
      html += field('Experiment', extra.experiment_id ? '#' + extra.experiment_id : null);
      break;
  }

  if (d.subproject_name) {
    html += '<div class="tt-field" style="margin-top:4px;border-top:1px solid #30363d;padding-top:4px"><span class="tt-field-label">Subproject:</span> <span class="tt-field-value">' + d.subproject_name + '</span></div>';
  }

  return html;
}

async function loadKG(projectId, includeSubprojects) {
  let kgData;
  try {
    kgData = await fetch('/api/projects/' + projectId + '/kg').then(function(r) { return r.json(); });
  } catch (e) {
    kgData = null;
  }

  if (kgData && kgData.nodes) {
    renderKGFromEndpoint(kgData, includeSubprojects);
    return;
  }

  await loadKGLegacy(projectId);
}

function renderKGFromEndpoint(kgData, includeSubprojects) {
  const nodes = [];
  const links = [];
  const nodeMap = {};

  const subprojectNames = {};
  const subprojectColorMap = {};
  const subprojectDepthMap = {};
  const subprojectParentMap = {};
  if (kgData.subprojects) {
    kgData.subprojects.forEach(function(sp, i) {
      subprojectNames[sp.id] = sp.alias || sp.name;
      subprojectColorMap[sp.id] = SUBPROJECT_COLORS[i % SUBPROJECT_COLORS.length];
      subprojectDepthMap[sp.id] = sp.depth !== undefined ? sp.depth : 0;
      subprojectParentMap[sp.id] = sp.parent_subproject_id || null;
    });
  }

  const typePrefix = {
    'finding': 'f', 'experiment': 'e', 'phase': 'p', 'decision': 'd',
    'research': 'r', 'principle': 'pr', 'hypothesis': 'h', 'constraint': 'co',
    'literature': 'l', 'feedback': 'fb'
  };

  for (const kn of kgData.nodes) {
    const prefix = typePrefix[kn.node_type] || 'x';
    const id = prefix + '-' + kn.node_id;

    let color = TYPE_COLORS[kn.node_type] || '#8b949e';
    if (kn.node_type === 'experiment') {
      color = kn.status === 'Pass' ? '#3fb950' : kn.status === 'Fail' ? '#f85149' : kn.status === 'Inconclusive' ? '#d29922' : '#8b949e';
    } else if (kn.node_type === 'hypothesis') {
      color = kn.status === 'Confirmed' ? '#3fb950' : kn.status === 'Refuted' ? '#f85149' : kn.status === 'Testing' ? '#58a6ff' : '#c084fc';
    } else if (kn.node_type === 'phase') {
      color = kn.status === 'Complete' ? '#3fb950' : kn.status === 'InProgress' ? '#58a6ff' : kn.status === 'Paused' ? '#f85149' : '#8b949e';
    }

    const node = {
      id: id, numId: kn.node_id, label: kn.label, text: kn.text,
      type: kn.node_type, color: color, status: kn.status,
      subproject_id: kn.subproject_id,
      subproject_name: kn.subproject_id ? subprojectNames[kn.subproject_id] : null,
      extra: kn.extra || {},
    };
    nodes.push(node);
    nodeMap[id] = node;

    if (kn.node_type === 'finding' && kn.extra && kn.extra.experiment_id && nodeMap['e-' + kn.extra.experiment_id]) {
      links.push({ source: 'e-' + kn.extra.experiment_id, target: id, relation: 'structural', color: '#30363d' });
    }
  }

  const edgeTypePrefix = {
    'Finding': 'f', 'Experiment': 'e', 'Phase': 'p', 'Decision': 'd',
    'Research': 'r', 'Principle': 'pr', 'Hypothesis': 'h', 'Constraint': 'co',
    'Literature': 'l', 'Feedback': 'fb'
  };

  for (const edge of kgData.edges) {
    const srcP = edgeTypePrefix[edge.source_type] || 'x';
    const tgtP = edgeTypePrefix[edge.target_type] || 'x';
    const src = srcP + '-' + edge.source_id;
    const tgt = tgtP + '-' + edge.target_id;
    if (nodeMap[src] && nodeMap[tgt]) {
      const rel = edge.relation;
      const color = rel === 'Contradicts' ? '#f85149' :
                    rel === 'Supports' ? '#3fb950' :
                    rel === 'Informed' ? '#e8883a' :
                    rel === 'Supersedes' ? '#a371f7' :
                    rel === 'DependsOn' ? '#79c0ff' :
                    rel === 'ProducedBy' ? '#30363d' :
                    rel === 'CitedIn' ? '#93c5fd' :
                    rel === 'DerivedFrom' ? '#fbbf24' :
                    rel === 'TestedBy' ? '#2dd4bf' :
                    rel === 'ViolatedBy' ? '#f87171' : '#30363d';
      links.push({ source: src, target: tgt, relation: rel, color: color });
    }
  }

  renderForceGraph(nodes, links, nodeMap, kgData.subprojects || [], subprojectColorMap, subprojectDepthMap, subprojectParentMap);
}

async function loadKGLegacy(projectId) {
  const [findings, edges, experiments, phases, decisions, research,
         principles, hypotheses, constraints, literature, feedback] = await Promise.all([
    fetch('/api/projects/' + projectId + '/findings').then(function(r) { return r.json(); }),
    fetch('/api/projects/' + projectId + '/edges').then(function(r) { return r.json(); }),
    fetch('/api/projects/' + projectId + '/experiments').then(function(r) { return r.json(); }),
    fetch('/api/projects/' + projectId + '/phases').then(function(r) { return r.json(); }),
    fetch('/api/projects/' + projectId + '/decisions').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('/api/projects/' + projectId + '/research').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('/api/projects/' + projectId + '/principles').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('/api/projects/' + projectId + '/hypotheses').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('/api/projects/' + projectId + '/constraints').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('/api/projects/' + projectId + '/literature').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('/api/projects/' + projectId + '/feedback').then(function(r) { return r.json(); }).catch(function() { return []; }),
  ]);

  const nodes = [];
  const links = [];
  const nodeMap = {};

  for (const e of [...experiments].sort(function(a, b) { return a.id - b.id; })) {
    const id = 'e-' + e.id;
    const statusColor = e.status === 'Pass' ? '#3fb950' : e.status === 'Fail' ? '#f85149' : e.status === 'Inconclusive' ? '#d29922' : '#8b949e';
    nodes.push({ id: id, numId: e.id, label: 'E' + e.id, text: e.name, type: 'experiment', color: statusColor, extra: {} });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const d of decisions) {
    const id = 'd-' + d.id;
    nodes.push({ id: id, numId: d.id, label: 'D' + d.id, text: d.what, type: 'decision', color: TYPE_COLORS.decision, extra: { why: d.why } });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const r of research) {
    const id = 'r-' + r.id;
    nodes.push({ id: id, numId: r.id, label: 'R' + r.id, text: r.name, type: 'research', color: TYPE_COLORS.research, extra: {} });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const f of findings) {
    const id = 'f-' + f.id;
    nodes.push({ id: id, numId: f.id, label: 'F' + f.id, text: f.text ? f.text.substring(0, 200) : '', type: 'finding', color: TYPE_COLORS.finding, extra: { experiment_id: f.experiment_id } });
    nodeMap[id] = nodes[nodes.length - 1];
    if (f.experiment_id && nodeMap['e-' + f.experiment_id]) {
      links.push({ source: 'e-' + f.experiment_id, target: id, relation: 'structural', color: '#30363d' });
    }
  }

  for (const p of principles) {
    const id = 'pr-' + p.id;
    nodes.push({ id: id, numId: p.id, label: 'P' + p.id, text: p.text ? p.text.substring(0, 200) : '', type: 'principle', color: TYPE_COLORS.principle, extra: { rationale: p.rationale, enforcement_level: p.enforcement_level, scope: p.scope } });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const h of hypotheses) {
    const id = 'h-' + h.id;
    const statusColor = h.status === 'Confirmed' ? '#3fb950' : h.status === 'Refuted' ? '#f85149' : h.status === 'Testing' ? '#58a6ff' : '#c084fc';
    nodes.push({ id: id, numId: h.id, label: 'H' + h.id, text: h.text ? h.text.substring(0, 200) : '', type: 'hypothesis', color: statusColor, extra: { prediction: h.prediction, criteria: h.criteria, confidence: h.confidence } });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const c of constraints) {
    const id = 'co-' + c.id;
    nodes.push({ id: id, numId: c.id, label: 'C' + c.id, text: c.text ? c.text.substring(0, 200) : '', type: 'constraint', color: TYPE_COLORS.constraint, extra: { severity: c.severity, resource: c.resource, measured_value: c.measured_value, expires_at: c.expires_at, source: c.source } });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const l of literature) {
    const id = 'l-' + l.id;
    nodes.push({ id: id, numId: l.id, label: 'L' + l.id, text: l.title, type: 'literature', color: TYPE_COLORS.literature, extra: { authors: l.authors, venue: l.venue, year: l.year, arxiv_id: l.arxiv_id, summary: l.summary } });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const p of phases) {
    const id = 'p-' + p.id;
    const statusColor = p.status === 'Complete' ? '#3fb950' : p.status === 'InProgress' ? '#58a6ff' : p.status === 'Paused' ? '#f85149' : '#8b949e';
    nodes.push({ id: id, numId: p.id, label: 'Ph' + p.id, text: p.name + ' [impact:' + p.impact + ']', type: 'phase', color: statusColor, extra: { impact: p.impact, description: p.description, goals: p.goals } });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  for (const f of feedback) {
    const id = 'fb-' + f.id;
    nodes.push({ id: id, numId: f.id, label: 'Fb' + f.id, text: f.text ? f.text.substring(0, 200) : '', type: 'feedback', color: TYPE_COLORS.feedback, extra: {} });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  const typePrefix = {
    'Finding': 'f', 'Experiment': 'e', 'Phase': 'p', 'Decision': 'd',
    'Research': 'r', 'Principle': 'pr', 'Hypothesis': 'h', 'Constraint': 'co',
    'Literature': 'l', 'Feedback': 'fb'
  };
  for (const edge of edges) {
    const srcP = typePrefix[edge.source_type] || 'x';
    const tgtP = typePrefix[edge.target_type] || 'x';
    const src = srcP + '-' + edge.source_id;
    const tgt = tgtP + '-' + edge.target_id;
    if (nodeMap[src] && nodeMap[tgt]) {
      const rel = edge.relation;
      const color = rel === 'Contradicts' ? '#f85149' : rel === 'Supports' ? '#3fb950' : rel === 'Informed' ? '#e8883a' : rel === 'Supersedes' ? '#a371f7' : rel === 'DependsOn' ? '#79c0ff' : '#30363d';
      links.push({ source: src, target: tgt, relation: rel, color: color });
    }
  }

  renderForceGraph(nodes, links, nodeMap, [], {}, {}, {});
}

function renderForceGraph(nodes, links, nodeMap, subprojects, subprojectColorMap, subprojectDepthMap, subprojectParentMap) {
  subprojectDepthMap = subprojectDepthMap || {};
  subprojectParentMap = subprojectParentMap || {};

  const container = document.getElementById('graph-container');
  container.innerHTML = '';
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  const svg = d3.select(container).append('svg').attr('width', W).attr('height', H);

  const defs = svg.append('defs');
  const arrowColors = {
    'Contradicts': '#f85149', 'Supports': '#3fb950', 'DependsOn': '#79c0ff',
    'Informed': '#e8883a', 'Supersedes': '#a371f7', 'DerivedFrom': '#fbbf24',
    'TestedBy': '#2dd4bf', 'ViolatedBy': '#f87171', 'CitedIn': '#93c5fd'
  };
  for (const [rel, col] of Object.entries(arrowColors)) {
    defs.append('marker')
      .attr('id', 'arrow-' + rel)
      .attr('viewBox', '0 0 8 5')
      .attr('refX', 12).attr('refY', 2.5)
      .attr('markerWidth', 4).attr('markerHeight', 3)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,0.5 L7,2.5 L0,4.5 Z')
      .attr('fill', col)
      .attr('fill-opacity', 0.7);
  }

  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#0d1117');
  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.1, 10]).on('zoom', function(e) { g.attr('transform', e.transform); });
  svg.call(zoom).on('dblclick.zoom', null);

  const edgeStyle = {
    'Contradicts': { width: 1.2, opacity: 0.6, dash: '', arrow: true },
    'Supports':    { width: 0.8, opacity: 0.4, dash: '', arrow: true },
    'DependsOn':   { width: 0.7, opacity: 0.35, dash: '4,2', arrow: true },
    'Informed':    { width: 0.7, opacity: 0.35, dash: '3,2', arrow: true },
    'Supersedes':  { width: 0.9, opacity: 0.45, dash: '5,2', arrow: true },
    'DerivedFrom': { width: 0.6, opacity: 0.3, dash: '3,2', arrow: true },
    'TestedBy':    { width: 0.6, opacity: 0.3, dash: '2,2', arrow: true },
    'ViolatedBy':  { width: 0.8, opacity: 0.4, dash: '', arrow: true },
    'RelatedTo':   { width: 0.4, opacity: 0.15, dash: '1,3', arrow: false },
    'ProducedBy':  { width: 0.3, opacity: 0.1, dash: '', arrow: false },
    'CitedIn':     { width: 0.5, opacity: 0.25, dash: '2,2', arrow: true },
    'structural':  { width: 0.3, opacity: 0.08, dash: '', arrow: false },
  };

  const simNodes = nodes.map(function(n) { return Object.assign({}, n); });
  const simLinks = links.map(function(l) { return {source: l.source, target: l.target, relation: l.relation, color: l.color}; });

  // Group subproject nodes for force clustering
  if (subprojects && subprojects.length > 0) {
    // Assign cluster centers to encourage grouping
    const clusterAngle = (2 * Math.PI) / Math.max(subprojects.length, 1);
    const clusterRadius = Math.min(W, H) * 0.25;
    subprojects.forEach(function(sp, i) {
      const cx = W / 2 + clusterRadius * Math.cos(clusterAngle * i);
      const cy = H / 2 + clusterRadius * Math.sin(clusterAngle * i);
      simNodes.forEach(function(n) {
        if (n.subproject_id === sp.id) {
          n.clusterX = cx;
          n.clusterY = cy;
        }
      });
    });
  }

  const simulation = d3.forceSimulation(simNodes)
    .force('link', d3.forceLink(simLinks).id(function(d) { return d.id; }).distance(function(d) {
      if (d.relation === 'structural') return 25;
      return 50;
    }).strength(0.8))
    .force('charge', d3.forceManyBody().strength(-120).distanceMax(300))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(function(d) {
      if (d.type === 'phase') return 25;
      if (d.type === 'finding') return 6;
      return 12;
    }))
    .force('x', d3.forceX(W / 2).strength(0.03))
    .force('y', d3.forceY(H / 2).strength(0.03));

  // Add clustering force for subproject grouping
  if (subprojects && subprojects.length > 0) {
    simulation.force('cluster', function(alpha) {
      simNodes.forEach(function(d) {
        if (d.clusterX !== undefined) {
          d.vx += (d.clusterX - d.x) * alpha * 0.08;
          d.vy += (d.clusterY - d.y) * alpha * 0.08;
        }
      });
    });
  }

  // Hull layer (below links and nodes)
  const hullG = g.append('g').attr('class', 'hulls');

  const linkG = g.append('g').attr('class', 'links');
  const linkEls = linkG.selectAll('line').data(simLinks).enter().append('line')
    .attr('stroke', function(d) { return d.color || '#30363d'; })
    .attr('stroke-width', function(d) { return (edgeStyle[d.relation] || edgeStyle['structural']).width; })
    .attr('stroke-opacity', function(d) { return (edgeStyle[d.relation] || edgeStyle['structural']).opacity; })
    .attr('stroke-dasharray', function(d) { return (edgeStyle[d.relation] || edgeStyle['structural']).dash || null; })
    .attr('marker-end', function(d) {
      const s = edgeStyle[d.relation] || edgeStyle['structural'];
      return s.arrow ? 'url(#arrow-' + d.relation + ')' : null;
    });

  const nodeG = g.append('g').attr('class', 'nodes');
  const nodeEls = nodeG.selectAll('g').data(simNodes).enter().append('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', function(ev, d) { if (!ev.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', function(ev, d) { d.fx = ev.x; d.fy = ev.y; })
      .on('end', function(ev, d) { if (!ev.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  nodeEls.each(function(d) {
    const el = d3.select(this);
    drawNodeShape(el, d.type, d.color, d.type === 'phase' ? 10 : d.type === 'finding' ? 6 : 8);
    if (d.type !== 'finding') {
      el.append('text')
        .attr('x', d.type === 'phase' ? 0 : 12)
        .attr('y', d.type === 'phase' ? 3 : 3)
        .attr('text-anchor', d.type === 'phase' ? 'middle' : 'start')
        .attr('fill', d.type === 'phase' ? '#0d1117' : d.color)
        .attr('font-size', '7px')
        .attr('font-weight', d.type === 'phase' ? 'bold' : 'normal')
        .text(d.label);
    }
  });

  function showTooltipForNode(d, ev) {
    tooltip.querySelector('.tt-type').textContent = d.type.toUpperCase();
    tooltip.querySelector('.tt-type').style.color = d.color;
    tooltip.querySelector('.tt-title').textContent = '#' + d.numId + ': ' + d.label;
    let html = buildTooltipHtml(d);
    if (d.type === 'phase') {
      html += buildPhaseRollup(d);
    }
    tooltip.querySelector('.tt-body').innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX + 12) + 'px';
    tooltip.style.top = (ev.clientY - 8) + 'px';
  }

  function highlightEdgesForNode(d) {
    linkEls.attr('stroke-opacity', 0.03);
    linkEls.filter(function(l) { return l.source.id === d.id || l.target.id === d.id; })
      .attr('stroke-opacity', 0.8).attr('stroke-width', 2);
  }

  function resetEdgeHighlight() {
    linkEls.each(function(l) {
      const s = edgeStyle[l.relation] || edgeStyle['structural'];
      d3.select(this).attr('stroke-opacity', s.opacity).attr('stroke-width', s.width);
    });
  }

  function hideTooltip() { tooltip.style.display = 'none'; }

  let phaseHighlightActive = false;

  function clearPhaseHighlight() {
    phaseHighlightActive = false;
    nodeEls.style('opacity', 1);
    resetEdgeHighlight();
  }

  function highlightPhaseRecursive(phaseNode) {
    phaseHighlightActive = true;
    const phaseId = phaseNode.id;
    const relatedNodeIds = new Set();
    relatedNodeIds.add(phaseId);

    simLinks.forEach(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      if (srcId === phaseId) relatedNodeIds.add(tgtId);
      if (tgtId === phaseId) relatedNodeIds.add(srcId);
    });

    const level1Ids = new Set(relatedNodeIds);
    simLinks.forEach(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      if (level1Ids.has(srcId)) relatedNodeIds.add(tgtId);
      if (level1Ids.has(tgtId)) relatedNodeIds.add(srcId);
    });

    const level2Ids = new Set(relatedNodeIds);
    simLinks.forEach(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      if (level2Ids.has(srcId)) relatedNodeIds.add(tgtId);
      if (level2Ids.has(tgtId)) relatedNodeIds.add(srcId);
    });

    nodeEls.style('opacity', function(d) { return relatedNodeIds.has(d.id) ? 1.0 : 0.15; });
    linkEls.each(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      const bothRelated = relatedNodeIds.has(srcId) && relatedNodeIds.has(tgtId);
      d3.select(this)
        .attr('stroke-opacity', bothRelated ? 0.8 : 0.03)
        .attr('stroke-width', bothRelated ? 2 : 0.3);
    });
  }

  function buildPhaseRollup(phaseNode) {
    const phaseId = phaseNode.id;
    const childIds = new Set();
    simLinks.forEach(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      if (srcId === phaseId) childIds.add(tgtId);
      if (tgtId === phaseId) childIds.add(srcId);
    });
    const level1 = new Set(childIds);
    simLinks.forEach(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      if (level1.has(srcId)) childIds.add(tgtId);
      if (level1.has(tgtId)) childIds.add(srcId);
    });
    const level2 = new Set(childIds);
    simLinks.forEach(function(l) {
      const srcId = typeof l.source === 'object' ? l.source.id : l.source;
      const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
      if (level2.has(srcId)) childIds.add(tgtId);
      if (level2.has(tgtId)) childIds.add(srcId);
    });

    const counts = { experiment: {}, finding: 0, hypothesis: 0, decision: 0, research: 0, literature: 0, principle: 0, constraint: 0 };
    simNodes.forEach(function(n) {
      if (!childIds.has(n.id) || n.id === phaseId) return;
      if (n.type === 'experiment') {
        const st = n.status || 'Pending';
        counts.experiment[st] = (counts.experiment[st] || 0) + 1;
      } else if (counts[n.type] !== undefined) {
        if (typeof counts[n.type] === 'number') counts[n.type]++;
      }
    });

    let html = '<div style="margin-top:6px;border-top:1px solid #30363d;padding-top:6px"><span class="tt-field-label">Phase Rollup:</span>';
    const expEntries = Object.entries(counts.experiment);
    if (expEntries.length > 0) {
      const expParts = expEntries.map(function(e) { return e[1] + ' ' + e[0]; }).join(', ');
      html += '<div class="tt-field"><span class="tt-field-value">Experiments: ' + expParts + '</span></div>';
    }
    if (counts.finding > 0) html += '<div class="tt-field"><span class="tt-field-value">Findings: ' + counts.finding + '</span></div>';
    if (counts.hypothesis > 0) html += '<div class="tt-field"><span class="tt-field-value">Hypotheses: ' + counts.hypothesis + '</span></div>';
    if (counts.decision > 0) html += '<div class="tt-field"><span class="tt-field-value">Decisions: ' + counts.decision + '</span></div>';
    if (counts.research > 0) html += '<div class="tt-field"><span class="tt-field-value">Research: ' + counts.research + '</span></div>';
    if (counts.literature > 0) html += '<div class="tt-field"><span class="tt-field-value">Literature: ' + counts.literature + '</span></div>';
    if (counts.principle > 0) html += '<div class="tt-field"><span class="tt-field-value">Principles: ' + counts.principle + '</span></div>';
    if (counts.constraint > 0) html += '<div class="tt-field"><span class="tt-field-value">Constraints: ' + counts.constraint + '</span></div>';
    html += '</div>';
    return html;
  }

  function clearPinnedVisual() {
    if (pinnedNodeEl) {
      d3.select(pinnedNodeEl).select('.node-shape').attr('stroke', null).attr('stroke-width', 0);
      pinnedNodeEl = null;
    }
  }

  svg.on('click', function() {
    if (pinnedNode || phaseHighlightActive) {
      clearPinnedVisual();
      pinnedNode = null;
      hideTooltip();
      clearPhaseHighlight();
    }
  });

  nodeEls
    .on('click', function(ev, d) {
      ev.stopPropagation();
      if (d.type === 'phase') {
        if (pinnedNode === d) {
          clearPinnedVisual(); pinnedNode = null; hideTooltip(); clearPhaseHighlight();
        } else {
          clearPinnedVisual();
          if (phaseHighlightActive) clearPhaseHighlight();
          pinnedNode = d; pinnedNodeEl = this;
          showTooltipForNode(d, ev);
          highlightPhaseRecursive(d);
          d3.select(this).select('.node-shape').attr('stroke', '#fbbf24').attr('stroke-width', 2.5);
        }
      } else {
        if (pinnedNode === d) {
          clearPinnedVisual(); pinnedNode = null; hideTooltip(); resetEdgeHighlight();
          if (phaseHighlightActive) clearPhaseHighlight();
        } else {
          clearPinnedVisual();
          if (phaseHighlightActive) clearPhaseHighlight();
          pinnedNode = d; pinnedNodeEl = this;
          showTooltipForNode(d, ev);
          highlightEdgesForNode(d);
          d3.select(this).select('.node-shape').attr('stroke', '#fbbf24').attr('stroke-width', 2.5);
        }
      }
    })
    .on('mouseenter', function(ev, d) {
      if (pinnedNode) return;
      showTooltipForNode(d, ev);
      highlightEdgesForNode(d);
      d3.select(this).select('.node-shape').attr('stroke', '#fff').attr('stroke-width', 2);
      const connectedIds = new Set([d.id]);
      simLinks.forEach(function(l) {
        const srcId = typeof l.source === 'object' ? l.source.id : l.source;
        const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
        if (srcId === d.id) connectedIds.add(tgtId);
        if (tgtId === d.id) connectedIds.add(srcId);
      });
      nodeEls.style('opacity', function(n) { return connectedIds.has(n.id) ? 1.0 : 0.25; });
    })
    .on('mouseleave', function(ev, d) {
      if (pinnedNode) return;
      hideTooltip();
      resetEdgeHighlight();
      nodeEls.style('opacity', 1);
      d3.select(this).select('.node-shape').attr('stroke', null).attr('stroke-width', 0);
    })
    .on('mousemove', function(ev) {
      if (pinnedNode) return;
      tooltip.style.left = (ev.clientX + 12) + 'px';
      tooltip.style.top = (ev.clientY - 8) + 'px';
    });

  // --- Nested convex hulls ---
  // Build parent-child relationship for subprojects to determine rendering order
  // Deeper hulls should render on top of shallower ones
  function getDescendantSubprojectIds(parentSpId) {
    const descendants = [];
    for (const sp of subprojects) {
      if (sp.parent_subproject_id === parentSpId) {
        descendants.push(sp.id);
        descendants.push.apply(descendants, getDescendantSubprojectIds(sp.id));
      }
    }
    return descendants;
  }

  function getNodesForSubproject(spId, includeDescendants) {
    // Get nodes directly belonging to this subproject
    const directNodes = simNodes.filter(function(n) { return n.subproject_id === spId; });
    if (!includeDescendants) return directNodes;
    // Also include nodes from all descendant subprojects (for outer hull)
    const descendantIds = getDescendantSubprojectIds(spId);
    const allNodes = simNodes.filter(function(n) {
      return n.subproject_id === spId || descendantIds.indexOf(n.subproject_id) >= 0;
    });
    return allNodes;
  }

  function updateHulls() {
    hullG.selectAll('*').remove();
    if (!subprojects || subprojects.length === 0) return;

    // Sort subprojects: draw deeper (child) hulls after shallower (parent) hulls
    // so children render on top
    const sortedSps = subprojects.slice().sort(function(a, b) {
      return (a.depth || 0) - (b.depth || 0);
    });

    for (const sp of sortedSps) {
      const depth = sp.depth !== undefined ? sp.depth : (subprojectDepthMap[sp.id] || 0);
      const hasChildSubprojects = subprojects.some(function(s) { return s.parent_subproject_id === sp.id; });

      // For parent subprojects, include descendant nodes in the hull
      const spNodes = hasChildSubprojects ? getNodesForSubproject(sp.id, true) : getNodesForSubproject(sp.id, false);
      if (spNodes.length < 2) {
        // Still draw a label for single-node subprojects
        if (spNodes.length === 1) {
          const n = spNodes[0];
          const color = subprojectColorMap[sp.id] || '#30363d';
          hullG.append('text')
            .attr('class', 'subproject-label')
            .attr('x', n.x).attr('y', n.y - 20)
            .attr('text-anchor', 'middle')
            .attr('fill', color)
            .attr('fill-opacity', 0.5)
            .text(sp.alias || sp.name);
        }
        continue;
      }

      const points = spNodes.map(function(n) { return [n.x, n.y]; });
      // Padding varies by depth: deeper = smaller padding
      const pad = Math.max(20, 35 - depth * 8);
      const padded = [];
      for (const pt of points) {
        padded.push([pt[0] - pad, pt[1] - pad]);
        padded.push([pt[0] + pad, pt[1] - pad]);
        padded.push([pt[0] + pad, pt[1] + pad]);
        padded.push([pt[0] - pad, pt[1] + pad]);
      }
      const hull = d3.polygonHull(padded);
      if (!hull) continue;

      const color = subprojectColorMap[sp.id] || '#30363d';
      // Fill opacity decreases with depth for visual nesting clarity
      const fillOpacity = Math.max(0.03, 0.08 - depth * 0.02);
      // Stroke opacity and width also adjust
      const strokeOpacity = Math.max(0.15, 0.3 - depth * 0.08);
      const strokeWidth = Math.max(0.5, 1.5 - depth * 0.3);
      // Dashed border for nested (depth > 0) hulls
      const strokeDash = depth > 0 ? '4,3' : '';

      // Smooth hull path using cardinal curve
      const hullPath = 'M' + hull.map(function(p) { return p[0] + ',' + p[1]; }).join('L') + 'Z';

      hullG.append('path')
        .attr('class', 'subproject-hull')
        .attr('d', hullPath)
        .attr('fill', color)
        .attr('fill-opacity', fillOpacity)
        .attr('stroke', color)
        .attr('stroke-opacity', strokeOpacity)
        .attr('stroke-width', strokeWidth)
        .attr('stroke-dasharray', strokeDash || null)
        .on('click', (function(spId) {
          return function(ev) {
            ev.stopPropagation();
            if (activeSubprojectFilter === spId) {
              activeSubprojectFilter = null;
              nodeEls.style('opacity', 1);
              linkEls.style('opacity', 1);
            } else {
              activeSubprojectFilter = spId;
              // Include descendant subproject nodes when filtering
              const descIds = getDescendantSubprojectIds(spId);
              const filterIds = [spId].concat(descIds);
              nodeEls.style('opacity', function(d) {
                return filterIds.indexOf(d.subproject_id) >= 0 ? 1 : 0.15;
              });
              linkEls.style('opacity', function(l) {
                const sId = typeof l.source === 'object' ? l.source.subproject_id : null;
                const tId = typeof l.target === 'object' ? l.target.subproject_id : null;
                return (filterIds.indexOf(sId) >= 0 || filterIds.indexOf(tId) >= 0) ? 1 : 0.05;
              });
            }
          };
        })(sp.id));

      // Label at top of hull
      const cx = d3.mean(spNodes, function(n) { return n.x; });
      const cy = d3.min(spNodes, function(n) { return n.y; }) - pad - 4;
      const fontSize = Math.max(8, 11 - depth * 1.5);
      hullG.append('text')
        .attr('class', 'subproject-label')
        .attr('x', cx).attr('y', cy)
        .attr('text-anchor', 'middle')
        .attr('fill', color)
        .attr('fill-opacity', Math.max(0.3, 0.6 - depth * 0.15))
        .attr('font-size', fontSize + 'px')
        .text(sp.alias || sp.name);
    }
  }

  simulation.on('tick', function() {
    linkEls
      .attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
      .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });
    nodeEls.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
    updateHulls();
  });

  simulation.alpha(1).restart();
  for (let i = 0; i < 300; i++) simulation.tick();
  simulation.alpha(0.01);
  linkEls
    .attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
    .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });
  nodeEls.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
  updateHulls();

  const allX = simNodes.map(function(n) { return n.x; });
  const allY = simNodes.map(function(n) { return n.y; });
  if (allX.length > 1) {
    const minX = Math.min.apply(null, allX) - 60;
    const maxX = Math.max.apply(null, allX) + 60;
    const minY = Math.min.apply(null, allY) - 60;
    const maxY = Math.max.apply(null, allY) + 60;
    const bw = maxX - minX;
    const bh = maxY - minY;
    const scale = Math.min(W / bw, H / bh, 3) * 0.85;
    const tx = W / 2 - (minX + bw / 2) * scale;
    const ty = H / 2 - (minY + bh / 2) * scale;
    svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}

async function loadDAG(projectId) {
  const phases = await fetch('/api/projects/' + projectId + '/phases').then(function(r) { return r.json(); });
  const container = document.getElementById('graph-container');
  container.innerHTML = '';
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  const pMap = {};
  phases.forEach(function(p) { pMap[p.id] = p; p.layer = 0; });
  let changed = true;
  while (changed) {
    changed = false;
    for (const p of phases) {
      for (const dep of p.depends_on) {
        if (pMap[dep] && pMap[dep].layer + 1 > p.layer) {
          p.layer = pMap[dep].layer + 1;
          changed = true;
        }
      }
    }
  }

  const layerGroups = {};
  phases.forEach(function(p) {
    if (!layerGroups[p.layer]) layerGroups[p.layer] = [];
    layerGroups[p.layer].push(p);
  });

  const layerSpacing = 160;
  const nodeSpacing = 70;

  phases.forEach(function(p) {
    const group = layerGroups[p.layer];
    const idx = group.indexOf(p);
    p.x = 80 + p.layer * layerSpacing;
    p.y = 60 + idx * nodeSpacing + (H / 2 - group.length * nodeSpacing / 2);
  });

  const svg = d3.select(container).append('svg').attr('width', W).attr('height', H);
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#0d1117');
  const gMain = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', function(e) { gMain.attr('transform', e.transform); });
  svg.call(zoom).on('dblclick.zoom', null);

  const defs = svg.append('defs');
  defs.append('marker')
    .attr('id', 'arrow-dag')
    .attr('viewBox', '0 0 10 6')
    .attr('refX', 10).attr('refY', 3)
    .attr('markerWidth', 6).attr('markerHeight', 4)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,0 L10,3 L0,6 Z')
    .attr('fill', '#79c0ff');

  for (const p of phases) {
    for (const dep of p.depends_on) {
      const src = pMap[dep];
      if (!src) continue;
      gMain.append('path')
        .attr('d', 'M' + (src.x + 30) + ',' + src.y + ' C' + ((src.x + p.x) / 2) + ',' + src.y + ' ' + ((src.x + p.x) / 2) + ',' + p.y + ' ' + (p.x - 30) + ',' + p.y)
        .attr('fill', 'none')
        .attr('stroke', '#30363d')
        .attr('stroke-width', 0.8)
        .attr('stroke-opacity', 0.4)
        .attr('marker-end', 'url(#arrow-dag)');
    }
  }

  for (const p of phases) {
    const color = p.status === 'Complete' ? '#3fb950' : p.status === 'InProgress' ? '#58a6ff' : p.status === 'Paused' ? '#f85149' : '#8b949e';
    const ng = gMain.append('g').attr('transform', 'translate(' + p.x + ', ' + p.y + ')')
      .style('cursor', 'pointer')
      .on('mouseenter', function(ev) {
        tooltip.querySelector('.tt-type').textContent = 'PHASE';
        tooltip.querySelector('.tt-type').style.color = color;
        tooltip.querySelector('.tt-title').textContent = '#' + p.id + ': ' + p.name;
        tooltip.querySelector('.tt-body').innerHTML = miniMarkdown(
          '**Impact:** ' + p.impact + '\n**Status:** ' + p.status +
          (p.description ? '\n' + p.description : '') +
          (p.goals ? '\n**Goals:** ' + p.goals : '')
        );
        tooltip.style.display = 'block';
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 8) + 'px';
      })
      .on('mouseleave', function() { tooltip.style.display = 'none'; })
      .on('mousemove', function(ev) {
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 8) + 'px';
      });
    ng.append('rect')
      .attr('x', -30).attr('y', -14)
      .attr('width', 60).attr('height', 28)
      .attr('rx', 6)
      .attr('fill', color)
      .attr('fill-opacity', 0.8);
    ng.append('text')
      .attr('text-anchor', 'middle')
      .attr('y', 4)
      .attr('fill', '#0d1117')
      .attr('font-size', '9px')
      .attr('font-weight', 'bold')
      .text('P' + p.id);
    ng.append('text')
      .attr('text-anchor', 'middle')
      .attr('y', 22)
      .attr('fill', '#8b949e')
      .attr('font-size', '7px')
      .text(p.name ? p.name.substring(0, 25) : '');
  }

  const allX = phases.map(function(p) { return p.x; });
  const allY = phases.map(function(p) { return p.y; });
  if (allX.length) {
    const minX = Math.min.apply(null, allX) - 60;
    const maxX = Math.max.apply(null, allX) + 60;
    const minY = Math.min.apply(null, allY) - 40;
    const maxY = Math.max.apply(null, allY) + 40;
    const bw = maxX - minX;
    const bh = maxY - minY;
    const scale = Math.min(W / bw, H / bh, 3) * 0.85;
    const tx = W / 2 - (minX + bw / 2) * scale;
    const ty = H / 2 - (minY + bh / 2) * scale;
    svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}

let activeSearchResults = null;
let searchHighlightActive = false;

const TYPE_ICONS = {
  finding: { letter: 'F', bg: '#58a6ff' },
  experiment: { letter: 'E', bg: '#3fb950' },
  decision: { letter: 'D', bg: '#e8883a' },
  phase: { letter: 'P', bg: '#8b949e' },
  hypothesis: { letter: 'H', bg: '#c084fc' },
  literature: { letter: 'L', bg: '#93c5fd' },
  principle: { letter: 'Pr', bg: '#fbbf24' },
  constraint: { letter: 'C', bg: '#f87171' },
  research: { letter: 'R', bg: '#2dd4bf' },
  feedback: { letter: 'Fb', bg: '#a5b4fc' },
};

const typePrefix = {
  'finding': 'f', 'experiment': 'e', 'phase': 'p', 'decision': 'd',
  'research': 'r', 'principle': 'pr', 'hypothesis': 'h', 'constraint': 'co',
  'literature': 'l', 'feedback': 'fb'
};

async function performSearch(query) {
  query = query.trim();
  if (!query) { clearSearch(); return; }

  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(query));
    const results = await res.json();
    activeSearchResults = results;
    renderSearchResults(results);
    applySearchHighlight(results);
  } catch (e) {
    console.error('Search failed:', e);
  }
}

function renderSearchResults(results) {
  const panel = document.getElementById('search-results');
  const list = document.getElementById('search-result-list');
  const countEl = document.getElementById('search-count');
  const clearBtn = document.getElementById('clear-search-btn');

  list.innerHTML = '';
  if (results.length === 0) {
    countEl.textContent = 'No results found';
    panel.style.display = 'block';
    clearBtn.style.display = 'block';
    return;
  }

  countEl.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '');
  panel.style.display = 'block';
  clearBtn.style.display = 'block';

  const maxScore = results.length > 0 ? Math.max.apply(null, results.map(function(r) { return r.score || 0; })) : 1;

  results.forEach(function(r, idx) {
    const item = document.createElement('div');
    item.className = 'search-result-item' + (idx < 5 ? ' top-result' : '');

    const iconInfo = TYPE_ICONS[r.node_type] || { letter: '?', bg: '#484f58' };
    const icon = document.createElement('div');
    icon.className = 'sr-icon';
    icon.style.background = iconInfo.bg;
    icon.textContent = iconInfo.letter;

    const body = document.createElement('div');
    body.className = 'sr-body';

    const typeLabel = document.createElement('div');
    typeLabel.className = 'sr-type';
    typeLabel.textContent = r.node_type + (r.project_seq ? ' #' + r.project_seq : ' id:' + r.node_id);

    const text = document.createElement('div');
    text.className = 'sr-text';
    text.textContent = r.text_excerpt;
    text.title = r.text_excerpt;

    body.appendChild(typeLabel);
    body.appendChild(text);

    const score = document.createElement('div');
    score.className = 'sr-score';
    score.textContent = (r.score || 0).toFixed(1);

    item.appendChild(icon);
    item.appendChild(body);
    item.appendChild(score);

    item.onclick = function() { centerOnSearchResult(r); };
    list.appendChild(item);
  });
}

function applySearchHighlight(results) {
  searchHighlightActive = true;

  // Get the current D3 elements from the SVG
  const container = document.getElementById('graph-container');
  const svg = container.querySelector('svg');
  if (!svg) return;

  const gRoot = svg.querySelector('g');
  if (!gRoot) return;

  // Build a set of matched node IDs (D3-style: prefix-numId)
  const matchedIds = new Set();
  const matchScores = {};
  var maxScore = 0;
  results.forEach(function(r) {
    var prefix = typePrefix[r.node_type] || 'x';
    var nodeId = prefix + '-' + r.node_id;
    matchedIds.add(nodeId);
    matchScores[nodeId] = r.score || 0;
    if ((r.score || 0) > maxScore) maxScore = r.score || 0;
  });
  if (maxScore === 0) maxScore = 1;

  // Build 1-hop context set
  var contextIds = new Set();
  var allLinks = d3.select(gRoot).select('.links').selectAll('line');
  allLinks.each(function(l) {
    if (!l) return;
    var srcId = typeof l.source === 'object' ? l.source.id : l.source;
    var tgtId = typeof l.target === 'object' ? l.target.id : l.target;
    if (matchedIds.has(srcId) && !matchedIds.has(tgtId)) contextIds.add(tgtId);
    if (matchedIds.has(tgtId) && !matchedIds.has(srcId)) contextIds.add(srcId);
  });

  // Top 5 result IDs for extra emphasis
  var top5 = new Set();
  results.slice(0, 5).forEach(function(r) {
    top5.add((typePrefix[r.node_type] || 'x') + '-' + r.node_id);
  });

  // Apply node styles
  var allNodes = d3.select(gRoot).select('.nodes').selectAll('g');
  allNodes.each(function(d) {
    if (!d) return;
    var el = d3.select(this);
    var shape = el.select('.node-shape');

    if (matchedIds.has(d.id)) {
      // Matched node: full opacity, boosted saturation, border
      el.style('opacity', 1.0);
      var normScore = (matchScores[d.id] || 0) / maxScore;
      // Boost the color saturation via a filter
      el.style('filter', top5.has(d.id) ? 'drop-shadow(0 0 4px ' + d.color + ') saturate(' + (1.0 + normScore * 0.5) + ')' : 'saturate(' + (1.0 + normScore * 0.3) + ')');
      shape.attr('stroke', top5.has(d.id) ? '#fbbf24' : '#58a6ff');
      shape.attr('stroke-width', top5.has(d.id) ? 3 : 1.5);
    } else if (contextIds.has(d.id)) {
      // 1-hop context: dimmed
      el.style('opacity', 0.3);
      el.style('filter', null);
      shape.attr('stroke', null);
      shape.attr('stroke-width', 0);
    } else {
      // Everything else: nearly hidden
      el.style('opacity', 0.08);
      el.style('filter', null);
      shape.attr('stroke', null);
      shape.attr('stroke-width', 0);
    }
  });

  // Apply edge styles
  allLinks.each(function(l) {
    if (!l) return;
    var srcId = typeof l.source === 'object' ? l.source.id : l.source;
    var tgtId = typeof l.target === 'object' ? l.target.id : l.target;
    var bothMatched = matchedIds.has(srcId) && matchedIds.has(tgtId);
    var oneMatchedOneContext = (matchedIds.has(srcId) && contextIds.has(tgtId)) || (matchedIds.has(tgtId) && contextIds.has(srcId));

    if (bothMatched) {
      d3.select(this).attr('stroke-opacity', 0.8).attr('stroke-width', 2);
    } else if (oneMatchedOneContext) {
      d3.select(this).attr('stroke-opacity', 0.25).attr('stroke-width', 1);
    } else {
      d3.select(this).attr('stroke-opacity', 0).attr('stroke-width', 0);
    }
  });
}

function clearSearch() {
  activeSearchResults = null;
  searchHighlightActive = false;

  document.getElementById('kg-search-box').value = '';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('clear-search-btn').style.display = 'none';
  document.getElementById('search-result-list').innerHTML = '';

  // Reset all node and edge styles
  var container = document.getElementById('graph-container');
  var svg = container.querySelector('svg');
  if (!svg) return;
  var gRoot = svg.querySelector('g');
  if (!gRoot) return;

  var allNodes = d3.select(gRoot).select('.nodes').selectAll('g');
  allNodes.each(function(d) {
    var el = d3.select(this);
    el.style('opacity', 1.0);
    el.style('filter', null);
    el.select('.node-shape').attr('stroke', null).attr('stroke-width', 0);
  });

  // Reset edges to their default styling
  var allLinks = d3.select(gRoot).select('.links').selectAll('line');
  allLinks.each(function(l) {
    if (!l) return;
    var rel = l.relation || 'structural';
    var edgeStyle = {
      'Contradicts': { width: 1.2, opacity: 0.6 },
      'Supports': { width: 0.8, opacity: 0.4 },
      'DependsOn': { width: 0.7, opacity: 0.35 },
      'Informed': { width: 0.7, opacity: 0.35 },
      'Supersedes': { width: 0.9, opacity: 0.45 },
      'DerivedFrom': { width: 0.6, opacity: 0.3 },
      'TestedBy': { width: 0.6, opacity: 0.3 },
      'ViolatedBy': { width: 0.8, opacity: 0.4 },
      'RelatedTo': { width: 0.4, opacity: 0.15 },
      'ProducedBy': { width: 0.3, opacity: 0.1 },
      'CitedIn': { width: 0.5, opacity: 0.25 },
      'structural': { width: 0.3, opacity: 0.08 },
    };
    var style = edgeStyle[rel] || edgeStyle['structural'];
    d3.select(this).attr('stroke-opacity', style.opacity).attr('stroke-width', style.width);
  });
}

function centerOnSearchResult(result) {
  var container = document.getElementById('graph-container');
  var svg = d3.select(container).select('svg');
  if (svg.empty()) return;

  var prefix = typePrefix[result.node_type] || 'x';
  var targetId = prefix + '-' + result.node_id;

  // Find the node in the simulation data
  var targetNode = null;
  var gRoot = svg.select('g');
  var allNodes = gRoot.select('.nodes').selectAll('g');

  allNodes.each(function(d) {
    if (d && d.id === targetId) {
      targetNode = d;
    }
  });

  if (!targetNode) return;

  // Get SVG dimensions
  var W = container.offsetWidth;
  var H = container.offsetHeight;

  // Zoom to center on the node
  var scale = 2.5;
  var tx = W / 2 - targetNode.x * scale;
  var ty = H / 2 - targetNode.y * scale;

  var zoom = d3.zoom().scaleExtent([0.1, 10]);
  svg.transition().duration(500).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );

  // Trigger pin behavior on the node
  allNodes.each(function(d) {
    if (d && d.id === targetId) {
      // Clear any existing pin
      if (pinnedNodeEl) {
        d3.select(pinnedNodeEl).select('.node-shape').attr('stroke', null).attr('stroke-width', 0);
      }
      pinnedNode = d;
      pinnedNodeEl = this;
      d3.select(this).select('.node-shape').attr('stroke', '#fbbf24').attr('stroke-width', 3);

      // Show tooltip
      tooltip.querySelector('.tt-type').textContent = d.type.toUpperCase();
      tooltip.querySelector('.tt-type').style.color = d.color;
      tooltip.querySelector('.tt-title').textContent = '#' + d.numId + ': ' + d.label;
      tooltip.querySelector('.tt-body').innerHTML = buildTooltipHtml(d);
      tooltip.style.display = 'block';
      tooltip.style.left = (W / 2 + 20) + 'px';
      tooltip.style.top = (H / 2 - 20) + 'px';
    }
  });
}
