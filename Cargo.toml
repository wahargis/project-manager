[package]
name = "pm"
version = "0.1.0"
edition = "2024"
description = "Research project management for long-horizon agentic work"
license = "MIT"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = []
mcp = ["tokio"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
