<!DOCTYPE html>
<html>
<head>
<title>PM — Research Project Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0d1117; color: #c9d1d9; }
#header { background: #161b22; padding: 12px 24px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
#header h1 { font-size: 16px; color: #58a6ff; }
#controls { display: flex; gap: 8px; }
button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; }
button:hover { background: #30363d; }
button.active { background: #1f6feb; border-color: #1f6feb; }
#main { display: flex; height: calc(100vh - 49px); }
#sidebar { width: 280px; min-width: 280px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; padding: 16px; position: relative; z-index: 5; }
#sidebar h2 { font-size: 13px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.project-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; }
.project-card:hover { border-color: #58a6ff; }
.project-card.selected { border-color: #1f6feb; background: #161b22; }
.project-card h3 { font-size: 14px; color: #f0f6fc; margin-bottom: 4px; }
.project-card .stats { font-size: 11px; color: #8b949e; }
.progress-bar { height: 4px; background: #21262d; border-radius: 2px; margin-top: 6px; }
.progress-fill { height: 100%; background: #3fb950; border-radius: 2px; }
#graph-container { flex: 1; position: relative; overflow: hidden; }
#graph-container svg { width: 100%; height: 100%; display: block; }
#tooltip { position: fixed; background: #1c2128; border: 1px solid #30363d; border-radius: 8px; padding: 12px; max-width: 420px; font-size: 11px; display: none; z-index: 100; pointer-events: none; }
#tooltip .tt-type { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
#tooltip .tt-title { color: #f0f6fc; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
#tooltip .tt-body { color: #8b949e; line-height: 1.4; }
.legend { position: absolute; bottom: 16px; right: 16px; background: #161b22ee; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 10px; z-index: 5; }
.legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-line { height: 2px; border-radius: 1px; }
</style>
</head>
<body>
<div id="header">
  <h1>PM — Research Dashboard</h1>
  <div id="controls">
    <button id="btn-kg" class="active" onclick="setView('kg')">Knowledge Graph</button>
    <button id="btn-dag" onclick="setView('dag')">Phase DAG</button>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <h2>Projects</h2>
    <div id="project-list"></div>
    <h2 style="margin-top:16px">Dashboard</h2>
    <div id="dashboard-text" style="font-size:11px;color:#8b949e;white-space:pre-wrap"></div>
  </div>
  <div id="graph-container"></div>
</div>
<div id="tooltip"><div class="tt-type"></div><div class="tt-title"></div><div class="tt-body"></div></div>
<div class="legend" id="legend-kg">
  <div style="font-weight:bold;margin-bottom:4px;color:#8b949e">BACKBONE</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Experiment</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d29922;border-radius:0;transform:rotate(45deg);width:8px;height:8px"></div>Decision</div>
  <div class="legend-item"><div class="legend-dot" style="background:#2dd4bf"></div>Research</div>
  <div style="font-weight:bold;margin:6px 0 4px;color:#8b949e">KNOWLEDGE</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Finding</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>Principle</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c084fc"></div>Hypothesis</div>
  <div class="legend-item"><div class="legend-dot" style="background:#93c5fd;border-radius:2px"></div>Literature</div>
  <div class="legend-item"><div class="legend-dot" style="background:#9ca3af"></div>Constraint</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b949e;border-radius:2px"></div>Phase</div>
  <div style="font-weight:bold;margin:6px 0 4px;color:#8b949e">EDGES</div>
  <div class="legend-item"><div class="legend-line" style="background:#f85149;width:20px"></div>Contradicts</div>
  <div class="legend-item"><div class="legend-line" style="background:#3fb950;width:20px"></div>Supports</div>
  <div class="legend-item"><div class="legend-line" style="background:#79c0ff;width:20px"></div>DependsOn</div>
  <div class="legend-item"><div class="legend-line" style="background:#d29922;width:20px"></div>Informed</div>
  <div class="legend-item"><div class="legend-line" style="background:#a371f7;width:20px"></div>Supersedes</div>
  <div class="legend-item"><div class="legend-line" style="background:#30363d;width:20px;opacity:0.3"></div>Structural</div>
</div>
<div class="legend" id="legend-dag" style="display:none">
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Complete</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>In Progress</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b949e"></div>Pending</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f85149"></div>Paused</div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
let currentProject = null;
let currentView = 'kg';
let svgRoot = null;

const tooltip = document.getElementById('tooltip');

async function loadProjects() {
  const res = await fetch('/api/projects');
  const projects = await res.json();
  const list = document.getElementById('project-list');
  list.innerHTML = '';
  for (const p of projects) {
    if (p.status !== 'Active') continue;
    const card = document.createElement('div');
    card.className = 'project-card';
    card.onclick = () => selectProject(p.id, card);
    const phases = await fetch(`/api/projects/${p.id}/phases`).then(r => r.json());
    const complete = phases.filter(ph => ph.status === 'Complete').length;
    card.innerHTML = `<h3>${p.name}</h3><div class="stats">${complete}/${phases.length} phases</div><div class="progress-bar"><div class="progress-fill" style="width:${phases.length?complete/phases.length*100:0}%"></div></div>`;
    list.appendChild(card);
  }
  const dash = await fetch('/api/dashboard').then(r => r.json());
  document.getElementById('dashboard-text').textContent = dash.text;
  if (projects.filter(p => p.status === 'Active').length > 0) {
    const first = projects.find(p => p.status === 'Active');
    selectProject(first.id, list.firstChild);
  }
}

async function selectProject(id, card) {
  currentProject = id;
  document.querySelectorAll('.project-card').forEach(c => c.classList.remove('selected'));
  if (card) card.classList.add('selected');
  const container = document.getElementById('graph-container');
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b949e;font-size:14px">Loading graph...</div>';
  if (currentView === 'kg') await loadKG(id);
  else await loadDAG(id);
}

function setView(view) {
  currentView = view;
  document.getElementById('btn-kg').classList.toggle('active', view === 'kg');
  document.getElementById('btn-dag').classList.toggle('active', view === 'dag');
  document.getElementById('legend-kg').style.display = view === 'kg' ? '' : 'none';
  document.getElementById('legend-dag').style.display = view === 'dag' ? '' : 'none';
  if (currentProject) {
    const card = document.querySelector('.project-card.selected');
    selectProject(currentProject, card);
  }
}

async function loadKG(projectId) {
  const [findings, edges, experiments, phases, decisions, research,
         principles, hypotheses, constraints, literature, feedback] = await Promise.all([
    fetch(`/api/projects/${projectId}/findings`).then(r => r.json()),
    fetch(`/api/projects/${projectId}/edges`).then(r => r.json()),
    fetch(`/api/projects/${projectId}/experiments`).then(r => r.json()),
    fetch(`/api/projects/${projectId}/phases`).then(r => r.json()),
    fetch(`/api/projects/${projectId}/decisions`).then(r => r.json()).catch(() => []),
    fetch(`/api/projects/${projectId}/research`).then(r => r.json()).catch(() => []),
    fetch(`/api/projects/${projectId}/principles`).then(r => r.json()).catch(() => []),
    fetch(`/api/projects/${projectId}/hypotheses`).then(r => r.json()).catch(() => []),
    fetch(`/api/projects/${projectId}/constraints`).then(r => r.json()).catch(() => []),
    fetch(`/api/projects/${projectId}/literature`).then(r => r.json()).catch(() => []),
    fetch(`/api/projects/${projectId}/feedback`).then(r => r.json()).catch(() => []),
  ]);

  const nodes = [];
  const links = [];
  const nodeMap = {};

  // Type prefix map for edge resolution
  const typePrefix = {
    'Finding': 'f', 'Experiment': 'e', 'Phase': 'p', 'Decision': 'd',
    'Research': 'r', 'Principle': 'pr', 'Hypothesis': 'h', 'Constraint': 'co',
    'Literature': 'l', 'Feedback': 'fb'
  };

  // === BACKBONE NODES (chronological chain) ===

  // Experiments — green circles, the primary backbone
  for (const e of [...experiments].sort((a, b) => a.id - b.id)) {
    const id = `e-${e.id}`;
    const statusColor = e.status === 'Pass' ? '#3fb950' : e.status === 'Fail' ? '#f85149' : e.status === 'Inconclusive' ? '#d29922' : '#8b949e';
    nodes.push({ id, numId: e.id, label: `E${e.id}`, text: e.name, type: 'experiment', color: statusColor, ts: e.created_at });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  // Decisions — orange diamonds, backbone branch points
  for (const d of decisions) {
    const id = `d-${d.id}`;
    const n = { id, numId: d.id, label: `D${d.id}`, text: d.what + (d.why ? ' -- ' + d.why : ''), type: 'decision', color: '#d29922', expId: d.experiment_id, ts: d.created_at };
    nodes.push(n); nodeMap[id] = n;
  }

  // Research — teal hexagons, backbone
  for (const r of research) {
    const id = `r-${r.id}`;
    const n = { id, numId: r.id, label: `R${r.id}`, text: r.name, type: 'research', color: '#2dd4bf', ts: r.created_at };
    nodes.push(n); nodeMap[id] = n;
  }

  // === KNOWLEDGE NODES (hang off backbone) ===

  // Findings — blue dots
  for (const f of findings) {
    const id = `f-${f.id}`;
    const n = { id, numId: f.id, label: `F${f.id}`, text: f.text ? f.text.substring(0, 120) : '', type: 'finding', color: '#58a6ff', expId: f.experiment_id };
    nodes.push(n); nodeMap[id] = n;
    // Structural edge: experiment → finding (grey, no arrow)
    if (f.experiment_id && nodeMap[`e-${f.experiment_id}`]) {
      links.push({ source: `e-${f.experiment_id}`, target: id, relation: 'structural', color: '#30363d' });
    }
  }

  // Principles — warm yellow pentagons
  for (const p of principles) {
    const id = `pr-${p.id}`;
    const scopeTag = p.scope === 'Universal' ? '[U]' : p.scope === 'Phase' ? '[Ph]' : '[Pr]';
    const n = { id, numId: p.id, label: `${scopeTag}P${p.id}`, text: p.text ? p.text.substring(0, 120) : '', type: 'principle', color: '#fbbf24' };
    nodes.push(n); nodeMap[id] = n;
  }

  // Hypotheses — purple triangles
  for (const h of hypotheses) {
    const id = `h-${h.id}`;
    const statusColor = h.status === 'Confirmed' ? '#3fb950' : h.status === 'Refuted' ? '#f85149' : h.status === 'Testing' ? '#58a6ff' : '#8b949e';
    const n = { id, numId: h.id, label: `H${h.id}`, text: h.text ? h.text.substring(0, 120) : '', type: 'hypothesis', color: statusColor };
    nodes.push(n); nodeMap[id] = n;
  }

  // Constraints — grey octagons
  for (const c of constraints) {
    const id = `co-${c.id}`;
    const n = { id, numId: c.id, label: `C${c.id}`, text: c.text ? c.text.substring(0, 120) : '', type: 'constraint', color: '#9ca3af' };
    nodes.push(n); nodeMap[id] = n;
  }

  // Literature — light blue books
  for (const l of literature) {
    const id = `l-${l.id}`;
    const arxiv = l.arxiv_id ? `[${l.arxiv_id}]` : '';
    const n = { id, numId: l.id, label: `L${l.id}`, text: `${l.title} ${arxiv}`, type: 'literature', color: '#93c5fd' };
    nodes.push(n); nodeMap[id] = n;
  }

  // Phases — status-colored rectangles
  for (const p of phases) {
    const id = `p-${p.id}`;
    const statusColor = p.status === 'Complete' ? '#3fb950' : p.status === 'InProgress' ? '#58a6ff' : p.status === 'Paused' ? '#f85149' : '#8b949e';
    nodes.push({ id, numId: p.id, label: `Ph${p.id}`, text: `${p.name} [impact:${p.impact}]`, type: 'phase', color: statusColor });
    nodeMap[id] = nodes[nodes.length - 1];
  }

  // === KG EDGES (semantic, colored) ===
  for (const edge of edges) {
    const srcP = typePrefix[edge.source_type] || 'x';
    const tgtP = typePrefix[edge.target_type] || 'x';
    const src = `${srcP}-${edge.source_id}`;
    const tgt = `${tgtP}-${edge.target_id}`;
    if (nodeMap[src] && nodeMap[tgt]) {
      const rel = edge.relation;
      const color = rel === 'Contradicts' ? '#f85149' :
                    rel === 'Supports' ? '#3fb950' :
                    rel === 'Informed' ? '#d29922' :
                    rel === 'Supersedes' ? '#a371f7' :
                    rel === 'DependsOn' ? '#79c0ff' :
                    rel === 'ProducedBy' ? '#30363d' :
                    rel === 'CitedIn' ? '#93c5fd' : '#30363d';
      links.push({ source: src, target: tgt, relation: rel, color });
    }
  }

  renderKG(nodes, links, nodeMap);
}

function renderKG(nodes, links, nodeMap) {
  const container = document.getElementById('graph-container');
  container.innerHTML = '';
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  // --- LAYOUT COMPUTATION ---
  // Unified chronological backbone: experiments + decisions + research interleaved
  // Decisions are branch points. Findings hang below. Phases span across top.
  // Principles, hypotheses, constraints, literature, feedback in peripheral bands.

  const backbone = nodes.filter(n => ['experiment', 'decision', 'research'].includes(n.type))
    .sort((a, b) => a.numId - b.numId); // chronological by ID
  const finds = nodes.filter(n => n.type === 'finding');
  const phas = nodes.filter(n => n.type === 'phase');
  const princs = nodes.filter(n => n.type === 'principle');
  const hyps = nodes.filter(n => n.type === 'hypothesis');
  const cons = nodes.filter(n => n.type === 'constraint');
  const lits = nodes.filter(n => n.type === 'literature');
  const fbs = nodes.filter(n => n.type === 'feedback');

  const XPAD = 100;
  const bbSpacing = 70;
  const totalW = backbone.length * bbSpacing + XPAD * 2;
  const centerY = 0;

  // Backbone X positions (unified timeline)
  const bbXMap = {}; // maps "type-id" to X position
  backbone.forEach((n, i) => {
    n.x = XPAD + i * bbSpacing;
    n.y = centerY;
    bbXMap[n.id] = n.x;
    // Also map by experiment ID for finding lookup
    if (n.type === 'experiment') bbXMap[`exp-${n.numId}`] = n.x;
  });

  // Findings: fishbone pattern below/above their parent experiment
  const findsByExp = {};
  finds.forEach(f => {
    const eid = f.expId || 0;
    if (!findsByExp[eid]) findsByExp[eid] = [];
    findsByExp[eid].push(f);
  });
  for (const [eid, fs] of Object.entries(findsByExp)) {
    const expX = bbXMap[`exp-${eid}`] !== undefined ? bbXMap[`exp-${eid}`] : XPAD + parseInt(eid) * 12;
    fs.forEach((f, i) => {
      const side = (i % 2 === 0) ? 1 : -1;
      const row = Math.floor(i / 2);
      f.x = expX + (row % 2 === 0 ? -5 : 5);
      f.y = centerY + side * (30 + row * 14);
    });
  }

  // Phases: top band
  phas.sort((a, b) => a.numId - b.numId).forEach((p, i) => {
    p.x = XPAD + (i / Math.max(phas.length - 1, 1)) * (totalW - XPAD * 2);
    p.y = centerY - 130;
  });

  // Principles: above phases, spread evenly
  princs.forEach((p, i) => {
    p.x = XPAD + (i / Math.max(princs.length - 1, 1)) * (totalW - XPAD * 2);
    p.y = centerY - 175;
  });

  // Hypotheses: just above backbone, near their experiment
  hyps.forEach((h, i) => {
    h.x = XPAD + (i / Math.max(hyps.length - 1, 1)) * (totalW - XPAD * 2) * 0.7 + totalW * 0.15;
    h.y = centerY - 55 - (i % 2) * 20;
  });

  // Constraints: right side, stacked vertically
  cons.forEach((c, i) => {
    c.x = totalW + 40;
    c.y = centerY - 80 + i * 20;
  });

  // Literature: left side, stacked
  lits.forEach((l, i) => {
    l.x = -40;
    l.y = centerY - 60 + i * 22;
  });

  // Feedback: bottom right corner
  fbs.forEach((f, i) => {
    f.x = totalW + 40;
    f.y = centerY + 40 + i * 18;
  });

  // --- SVG RENDERING ---
  const svg = d3.select(container).append('svg')
    .attr('width', W)
    .attr('height', H);

  // Defs for arrowheads
  const defs = svg.append('defs');
  const arrowColors = {
    'Contradicts': '#f85149', 'Supports': '#3fb950', 'DependsOn': '#79c0ff',
    'Informed': '#d29922', 'Supersedes': '#a371f7', 'produces': '#30363d'
  };
  for (const [rel, col] of Object.entries(arrowColors)) {
    defs.append('marker')
      .attr('id', `arrow-${rel}`)
      .attr('viewBox', '0 0 8 5')
      .attr('refX', 8).attr('refY', 2.5)
      .attr('markerWidth', 4).attr('markerHeight', 3)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,0.5 L7,2.5 L0,4.5 Z')
      .attr('fill', col)
      .attr('fill-opacity', 0.6);
  }

  // Background rect to capture all pointer events for zoom/pan
  svg.append('rect')
    .attr('width', W)
    .attr('height', H)
    .attr('fill', '#0d1117');

  const g = svg.append('g');

  // Zoom + pan
  const zoom = d3.zoom()
    .scaleExtent([0.15, 10])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom)
    .on('dblclick.zoom', null); // disable double-click zoom

  // Edge style: structural (grey, no arrow) vs semantic (colored, arrow)
  const edgeStyle = {
    'Contradicts': { width: 0.8, opacity: 0.45, dash: '', arrow: true },
    'Supports':    { width: 0.6, opacity: 0.25, dash: '', arrow: true },
    'DependsOn':   { width: 0.5, opacity: 0.2, dash: '3,2', arrow: true },
    'Informed':    { width: 0.5, opacity: 0.25, dash: '2,2', arrow: true },
    'Supersedes':  { width: 0.7, opacity: 0.35, dash: '5,2', arrow: true },
    'RelatedTo':   { width: 0.3, opacity: 0.12, dash: '1,3', arrow: false },
    'ProducedBy':  { width: 0.3, opacity: 0.08, dash: '', arrow: false },
    'CitedIn':     { width: 0.4, opacity: 0.15, dash: '2,2', arrow: true },
    'structural':  { width: 0.25, opacity: 0.06, dash: '', arrow: false },
  };

  // Draw ALL edges (structural + semantic)
  const edgeG = g.append('g').attr('class', 'edges');
  for (const link of links) {
    const src = nodeMap[link.source];
    const tgt = nodeMap[link.target];
    if (!src || !tgt || src.x === undefined || tgt.x === undefined) continue;

    const rel = link.relation || 'structural';
    const style = edgeStyle[rel] || edgeStyle['structural'];
    const col = link.color || '#30363d';

    const dx = tgt.x - src.x;
    const dy = tgt.y - src.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    let path;
    if (rel === 'Contradicts') {
      // Gentle arc above the line for contradictions
      const mx = (src.x + tgt.x) / 2;
      const my = Math.min(src.y, tgt.y) - Math.min(dist * 0.15, 50);
      path = `M${src.x},${src.y} Q${mx},${my} ${tgt.x},${tgt.y}`;
    } else if (rel === 'Supersedes') {
      // Slight S-curve
      const mx = (src.x + tgt.x) / 2;
      const my = (src.y + tgt.y) / 2 - 15;
      path = `M${src.x},${src.y} Q${mx},${my} ${tgt.x},${tgt.y}`;
    } else {
      // Near-straight with minimal curve to disambiguate overlapping edges
      const mx = (src.x + tgt.x) / 2;
      const my = (src.y + tgt.y) / 2;
      const perpX = -dy / (dist || 1) * 6;
      const perpY = dx / (dist || 1) * 6;
      path = `M${src.x},${src.y} Q${mx + perpX},${my + perpY} ${tgt.x},${tgt.y}`;
    }

    edgeG.append('path')
      .attr('d', path)
      .attr('fill', 'none')
      .attr('stroke', col)
      .attr('stroke-width', style.width)
      .attr('stroke-opacity', style.opacity)
      .attr('stroke-dasharray', style.dash || null)
      .attr('marker-end', style.arrow ? `url(#arrow-${rel})` : null)
      .style('pointer-events', 'stroke')
      .on('mouseenter', function() {
        d3.select(this).attr('stroke-opacity', 0.85).attr('stroke-width', style.width + 0.8);
      })
      .on('mouseleave', function() {
        d3.select(this).attr('stroke-opacity', style.opacity).attr('stroke-width', style.width);
      });
  }

  // Draw nodes
  const nodeG = g.append('g').attr('class', 'nodes');

  for (const n of nodes) {
    if (n.x === undefined) continue;
    const ng = nodeG.append('g')
      .attr('transform', `translate(${n.x}, ${n.y})`)
      .style('cursor', 'pointer')
      .on('mouseenter', function(ev) {
        tooltip.querySelector('.tt-type').textContent = n.type.toUpperCase();
        tooltip.querySelector('.tt-type').style.color = n.color;
        tooltip.querySelector('.tt-title').textContent = `#${n.numId}: ${n.label}`;
        tooltip.querySelector('.tt-body').textContent = n.text ? n.text.substring(0, 300) : '';
        tooltip.style.display = 'block';
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 8) + 'px';
        // Highlight connected edges
        edgeG.selectAll('path').attr('stroke-opacity', function() { return 0.05; });
        edgeG.selectAll('path').filter(function() {
          const d = this.__data__;
          return false; // edges don't have __data__ in this approach
        });
        d3.select(this).select('.node-shape').attr('stroke', '#fff').attr('stroke-width', 2);
      })
      .on('mouseleave', function() {
        tooltip.style.display = 'none';
        edgeG.selectAll('path').each(function() {
          const el = d3.select(this);
          // Restore original opacity from stored attribute
        });
        d3.select(this).select('.node-shape').attr('stroke', null).attr('stroke-width', 0);
      })
      .on('mousemove', function(ev) {
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 8) + 'px';
      });

    // Node shape based on type
    if (n.type === 'experiment') {
      ng.append('circle').attr('class', 'node-shape').attr('r', 8).attr('fill', n.color).attr('fill-opacity', 0.85);
      ng.append('text').attr('x', 0).attr('y', -12).attr('text-anchor', 'middle').attr('fill', '#8b949e').attr('font-size', '8px').text(n.label);
    } else if (n.type === 'decision') {
      ng.append('polygon').attr('class', 'node-shape').attr('points', '0,-10 10,0 0,10 -10,0').attr('fill', n.color).attr('fill-opacity', 0.9);
      ng.append('text').attr('x', 13).attr('y', 3).attr('fill', '#d29922').attr('font-size', '8px').text(n.label);
    } else if (n.type === 'research') {
      // Hexagon — teal
      const hex = '0,-8 7,-4 7,4 0,8 -7,4 -7,-4';
      ng.append('polygon').attr('class', 'node-shape').attr('points', hex).attr('fill', n.color).attr('fill-opacity', 0.85);
      ng.append('text').attr('x', 10).attr('y', 3).attr('fill', '#2dd4bf').attr('font-size', '8px').text(n.label);
    } else if (n.type === 'finding') {
      ng.append('circle').attr('class', 'node-shape').attr('r', 3.5).attr('fill', n.color).attr('fill-opacity', 0.55);
    } else if (n.type === 'principle') {
      // Pentagon — warm yellow
      const pent = '0,-7 6.7,-2.2 4.1,5.7 -4.1,5.7 -6.7,-2.2';
      ng.append('polygon').attr('class', 'node-shape').attr('points', pent).attr('fill', n.color).attr('fill-opacity', 0.8);
      ng.append('text').attr('x', 9).attr('y', 3).attr('fill', '#fbbf24').attr('font-size', '7px').text(n.label);
    } else if (n.type === 'hypothesis') {
      // Triangle pointing right
      ng.append('polygon').attr('class', 'node-shape').attr('points', '-5,-7 8,0 -5,7').attr('fill', n.color).attr('fill-opacity', 0.75);
      ng.append('text').attr('x', 11).attr('y', 3).attr('fill', n.color).attr('font-size', '7px').text(n.label);
    } else if (n.type === 'constraint') {
      // Octagon — grey with red border
      const oct = '3,-7 7,-3 7,3 3,7 -3,7 -7,3 -7,-3 -3,-7';
      ng.append('polygon').attr('class', 'node-shape').attr('points', oct).attr('fill', '#1c2128').attr('stroke', '#f85149').attr('stroke-width', 0.8).attr('fill-opacity', 0.7);
      ng.append('text').attr('x', 10).attr('y', 3).attr('fill', '#9ca3af').attr('font-size', '6px').text(n.label);
    } else if (n.type === 'literature') {
      // Rounded square — light blue
      ng.append('rect').attr('class', 'node-shape').attr('x', -6).attr('y', -6).attr('width', 12).attr('height', 12).attr('rx', 3).attr('fill', n.color).attr('fill-opacity', 0.65);
      ng.append('text').attr('x', 9).attr('y', 3).attr('fill', '#93c5fd').attr('font-size', '7px').text(n.label);
    } else if (n.type === 'phase') {
      ng.append('rect').attr('class', 'node-shape').attr('x', -20).attr('y', -8).attr('width', 40).attr('height', 16).attr('rx', 4).attr('fill', n.color).attr('fill-opacity', 0.7);
      ng.append('text').attr('x', 0).attr('y', 3).attr('text-anchor', 'middle').attr('fill', '#0d1117').attr('font-size', '7px').attr('font-weight', 'bold').text(n.label);
    } else if (n.type === 'feedback') {
      // Small flag
      ng.append('rect').attr('class', 'node-shape').attr('x', -4).attr('y', -4).attr('width', 8).attr('height', 8).attr('rx', 1).attr('fill', n.color === 'Correction' ? '#f85149' : '#3fb950').attr('fill-opacity', 0.6);
    }
  }

  // Initial zoom to fit
  const allX = nodes.filter(n => n.x !== undefined).map(n => n.x);
  const allY = nodes.filter(n => n.y !== undefined).map(n => n.y);
  if (allX.length) {
    const minX = Math.min(...allX) - 40;
    const maxX = Math.max(...allX) + 40;
    const minY = Math.min(...allY) - 40;
    const maxY = Math.max(...allY) + 40;
    const bw = maxX - minX;
    const bh = maxY - minY;
    const scale = Math.min(W / bw, H / bh, 3) * 0.9;
    const tx = W / 2 - (minX + bw / 2) * scale;
    const ty = H / 2 - (minY + bh / 2) * scale;
    svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}

async function loadDAG(projectId) {
  const phases = await fetch(`/api/projects/${projectId}/phases`).then(r => r.json());
  const container = document.getElementById('graph-container');
  container.innerHTML = '';
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  // Topological layering
  const pMap = {};
  phases.forEach(p => { pMap[p.id] = p; p.layer = 0; });
  // Iterative layering
  let changed = true;
  while (changed) {
    changed = false;
    for (const p of phases) {
      for (const dep of p.depends_on) {
        if (pMap[dep] && pMap[dep].layer + 1 > p.layer) {
          p.layer = pMap[dep].layer + 1;
          changed = true;
        }
      }
    }
  }

  const maxLayer = Math.max(...phases.map(p => p.layer), 0);
  const layerGroups = {};
  phases.forEach(p => {
    if (!layerGroups[p.layer]) layerGroups[p.layer] = [];
    layerGroups[p.layer].push(p);
  });

  const layerSpacing = 160;
  const nodeSpacing = 70;
  const startX = 80;
  const startY = 60;

  phases.forEach(p => {
    const group = layerGroups[p.layer];
    const idx = group.indexOf(p);
    p.x = startX + p.layer * layerSpacing;
    p.y = startY + idx * nodeSpacing + (H / 2 - group.length * nodeSpacing / 2);
  });

  const svg = d3.select(container).append('svg').attr('width', W).attr('height', H);
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#0d1117');
  const gMain = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => gMain.attr('transform', e.transform));
  svg.call(zoom).on('dblclick.zoom', null);

  // Edges
  for (const p of phases) {
    for (const dep of p.depends_on) {
      const src = pMap[dep];
      if (!src) continue;
      gMain.append('path')
        .attr('d', `M${src.x + 30},${src.y} C${(src.x + p.x) / 2},${src.y} ${(src.x + p.x) / 2},${p.y} ${p.x - 30},${p.y}`)
        .attr('fill', 'none')
        .attr('stroke', '#30363d')
        .attr('stroke-width', 0.8)
        .attr('stroke-opacity', 0.4)
        .attr('marker-end', 'url(#arrow-DependsOn)');
    }
  }

  // Nodes
  for (const p of phases) {
    const color = p.status === 'Complete' ? '#3fb950' : p.status === 'InProgress' ? '#58a6ff' : p.status === 'Paused' ? '#f85149' : '#8b949e';
    const ng = gMain.append('g').attr('transform', `translate(${p.x}, ${p.y})`);
    ng.append('rect')
      .attr('x', -30).attr('y', -14)
      .attr('width', 60).attr('height', 28)
      .attr('rx', 6)
      .attr('fill', color)
      .attr('fill-opacity', 0.8);
    ng.append('text')
      .attr('text-anchor', 'middle')
      .attr('y', 4)
      .attr('fill', '#0d1117')
      .attr('font-size', '9px')
      .attr('font-weight', 'bold')
      .text(`P${p.id}`);
    ng.append('text')
      .attr('text-anchor', 'middle')
      .attr('y', 22)
      .attr('fill', '#8b949e')
      .attr('font-size', '7px')
      .text(p.name ? p.name.substring(0, 25) : '');
  }

  // Defs for DAG arrows too
  const defs = svg.append('defs');
  defs.append('marker')
    .attr('id', 'arrow-DependsOn')
    .attr('viewBox', '0 0 10 6')
    .attr('refX', 10).attr('refY', 3)
    .attr('markerWidth', 6).attr('markerHeight', 4)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,0 L10,3 L0,6 Z')
    .attr('fill', '#79c0ff');

  // Zoom to fit
  const allX = phases.map(p => p.x);
  const allY = phases.map(p => p.y);
  if (allX.length) {
    const minX = Math.min(...allX) - 60;
    const maxX = Math.max(...allX) + 60;
    const minY = Math.min(...allY) - 40;
    const maxY = Math.max(...allY) + 40;
    const bw = maxX - minX;
    const bh = maxY - minY;
    const scale = Math.min(W / bw, H / bh, 3) * 0.85;
    const tx = W / 2 - (minX + bw / 2) * scale;
    const ty = H / 2 - (minY + bh / 2) * scale;
    svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }
}

  if (currentProject) {
